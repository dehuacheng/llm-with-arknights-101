  notes: ''
- id: Q069
  category: world
  answer_type: factoid
  difficulty: medium
  question_zh: 罗德岛医疗档案里，「体细胞与源石融合率」和「血液源石结晶密度」分别衡量什么？
  question_en: What do "cell-Originium fusion rate" and "blood Originium crystal density" each measure on a Rhodes Island
    medical report?
  gold_zh: 前者反映源石与体细胞融合的深度（感染深度，越高越严重）；后者反映血液中源石颗粒的浓度（单位u/L，越高代表病情发展越危险）。两项数据共同决定治疗与照护策略。
  gold_en: The first measures how deeply Originium has fused with the body's cells — i.e. infection depth (higher means more
    severe); the second measures the concentration of Originium particles in the blood (in u/L, higher means more dangerous
    progression). The two together guide treatment and care.
  key_facts:
  - 体细胞与源石融合率 / cell-Originium fusion rate
  - 血液源石结晶密度 / blood Originium crystal density
  - 感染深度 / infection depth
  - u/L 单位 / unit u/L
  traps:
  - 两项指标只是档案形式参数，不影响治疗 / the two metrics are decorative and don't affect treatment (partial truth / false)
  - 二者等价，只是不同写法 / they are equivalent, just different names (false)
  tags:
  - oripathy
  - medical
  - world
  source: cn/operators/char_017_huang.txt
  notes: ''
- id: Q070
  category: world
  answer_type: open_ended
  difficulty: medium
  question_zh: 矿石病感染者在泰拉社会中的处境如何？这和整合运动的诞生有什么关系？
  question_en: How are the Infected treated in Terran society, and what does this have to do with Reunion?
  gold_zh: 矿石病感染者普遍遭受歧视、隔离和驱赶，许多国家会将他们流放或限制活动；这种「成见」本身是整合运动等武装独立运动产生的重要社会根源。罗德岛正是希望通过医治矿石病并破除这种成见来弥合双方仇恨。
  gold_en: Infected face widespread discrimination, segregation and exile across Terra. That prejudice is itself a major root
    cause of armed movements like Reunion. Rhodes Island's mission is explicitly to treat Oripathy and break down the prejudice,
    bridging the gap between Infected and ordinary people.
  key_facts:
  - 歧视 / discrimination
  - 隔离 / segregation
  - 整合运动根源 / root cause of Reunion
  - 罗德岛使命 / Rhodes Island's mission
  traps:
  - 感染者普遍受同情和优待 / Infected are generally pitied and given priority care (false)
  - 整合运动是凯尔希秘密扶植 / Reunion is secretly seeded by Kal'tsit (off-canon)
  tags:
  - oripathy
  - reunion
  - rhodes_island
  - world
  source: cn/operators/char_003_kalts.txt
  notes: ''
- id: Q071
  category: world
  answer_type: open_ended
  difficulty: medium
  question_zh: 天灾对泰拉文明有什么具体影响？和源石如何相互作用？
  question_en: What concrete effects do Catastrophes have on Terra, and how do they interact with Originium?
  gold_zh: 天灾是泰拉大陆上反复发生的大规模自然灾害，会大范围扩散源石碎片；天灾过后，受灾地区遗留的源石残骸又会进一步引发矿石病爆发，构成「天灾—源石—矿石病」的连环危机。
  gold_en: Catastrophes are recurring large-scale natural disasters that scatter Originium fragments across wide areas; the
    contaminated debris they leave behind in turn drives fresh outbreaks of Oripathy among survivors — a chain of Catastrophe
    → Originium → Oripathy.
  key_facts:
  - 天灾 / Catastrophe
  - 扩散源石 / spreads Originium
  - 引发矿石病爆发 / triggers Oripathy outbreaks
  traps:
  - 天灾是源石浓度过高引发的放电，过后地区不再有源石 / Catastrophes discharge Originium and clear the region (off-canon)
  - 天灾只是普通的风暴，与源石无关 / Catastrophes are ordinary storms unrelated to Originium (false)
  tags:
  - catastrophe
  - originium
  - oripathy
  - world
  source: cn/stories/main_00.txt
  notes: ''
- id: Q072
  category: world
  answer_type: open_ended
  difficulty: easy
  question_zh: 泰拉的「移动城市」是什么概念？切尔诺伯格是其中之一吗？
  question_en: What is a "movable city" in Terra, and is Chernobog one of them?
  gold_zh: 泰拉许多城市建在巨大的可移动平台上，以便在天灾来临时躲避或迁移。切尔诺伯格就是这样一座移动城市；其核心城甚至在切尔诺伯格事件中被整合运动劫持并驶向龙门。
  gold_en: Many Terran cities sit on enormous movable platforms so they can flee or relocate ahead of a Catastrophe. Chernobog
    is one such mobile city; in the Chernobog incident, Reunion even hijacks its Core City and steers it at Lungmen.
  key_facts:
