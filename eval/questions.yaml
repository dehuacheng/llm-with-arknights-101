  category: faction
  answer_type: factoid
  difficulty: medium
  question_zh: 整合运动的领导者是谁？这个组织的核心诉求是什么？
  question_en: Who led Reunion, and what was its core demand?
  gold_zh: '整合运动由塔露拉领导，是一个由感染者组成的武装独立运动。它以暴力反抗

    乌萨斯帝国对感染者的压迫与歧视为核心诉求。

    '
  gold_en: 'Reunion was led by Talulah. It was an armed Infected separatist movement

    whose core demand was violent resistance to the Ursus Empire''s

    oppression and discrimination of the Infected.

    '
