- id: Q001
  category: character
  answer_type: factoid
  difficulty: easy
  question_zh: 罗德岛的公开领袖是谁？她的种族是什么？
  question_en: Who is the public leader of Rhodes Island, and what is her race?
  gold_zh: |
    阿米娅。她是出身于雷姆必拓的卡特斯/奇美拉感染者，同时也是萨卡兹的新一任“魔王”，
    继承自特蕾西娅。
  gold_en: |
    Amiya. She is a Cautus/Chimera Infected born in Rim Billiton, and also the
    new Sarkaz "Demon Lord" — a title inherited from Theresa.
  key_facts:
    - "阿米娅 / Amiya"
    - "罗德岛公开领袖 / public leader of Rhodes Island"
    - "卡特斯 / Cautus (race)"
    - "魔王 / Demon Lord"
  traps: []
  tags: [rhodes-island, amiya, character-identity]
  source: char_v3/char_002_amiya.txt

- id: Q002
  category: character
  answer_type: factoid
  difficulty: easy
  question_zh: 罗德岛医疗部门的负责人是谁？
  question_en: Who is the head of Rhodes Island's medical department?
  gold_zh: |
    凯尔希。她是罗德岛制药公司的医疗部门负责人，也是最高管理层之一，
    与特蕾西娅共同建立了罗德岛的前身——巴别塔。
  gold_en: |
    Kal'tsit. She is the head of Rhodes Island Pharmaceuticals' medical
    department and one of its top executives; she co-founded Babel — Rhodes
    Island's predecessor — with Theresa.
  key_facts:
    - "凯尔希 / Kal'tsit"
    - "罗德岛医疗部门负责人 / head of Rhodes Island's medical department"
    - "最高管理层 / top executive"
    - "与特蕾西娅共建巴别塔 / co-founded Babel with Theresa"
  traps: []
  tags: [rhodes-island, kal-tsit, leadership]
  source: char_v3/char_003_kalts.txt

- id: Q003
  category: character
  answer_type: factoid
  difficulty: medium
  question_zh: 德克萨斯的真实身份是什么？她为什么会来到龙门？
  question_en: What is Texas's true identity, and why did she come to Lungmen?
  gold_zh: |
    德克萨斯是已覆灭的叙拉古显赫家族——德克萨斯家族的最后血脉。她在家族遭遇血腥
    覆灭后选择逃离故乡，来到龙门，在大帝的帮助下加入了企鹅物流。
  gold_en: |
    Texas is the last bloodline of the Texas family — a prominent Siracusan
    house that was bloodily destroyed. After her family's fall, she fled her
    homeland for Lungmen, where she joined Penguin Logistics with help from
    Emperor.
  key_facts:
    - "叙拉古 / Siracusa"
    - "德克萨斯家族最后血脉 / last bloodline of the Texas family"
    - "家族覆灭 / family was destroyed"
    - "企鹅物流 / Penguin Logistics"
    - "大帝 / Emperor (helper)"
  traps: []
  tags: [texas, penguin-logistics, siracusa]
  source: char_v3/char_102_texas.txt

