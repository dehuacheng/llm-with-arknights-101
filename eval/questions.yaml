    and FrostNova to found Reunion. Alina's death and the "banality of evil" she witnessed drove her to despair — triggering
    Kaschey's pre-planted "Undying Black Serpent" curse, which hijacked her consciousness and turned Reunion into a pawn of
    his schemes.
