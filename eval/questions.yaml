- id: Q176
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 请简述龙门近卫局在主线第二至六章中扮演的角色。
  question_en: Summarize the role of the Lungmen Guard Department across main Episodes 2-6.
  gold_zh: 龙门近卫局是龙门的城市警备力量，由特别督察组组长陈代表罗德岛对外接触。第二至四章中，近卫局与罗德岛合作搜寻和争夺米莎、对抗整合运动渗透；第六章则与罗德岛联手对城内整合运动展开最后围剿，期间龙门执政者魏彦吾秘密动用「黑蓑」清理贫民区，引发陈与罗德岛对龙门手段的质疑。
  gold_en: The Lungmen Guard Department is the city's police-and-defense arm. Its special-inspection chief Ch'en is the main
    contact for Rhodes Island. Across Episodes 2-4 the LGD cooperates with Rhodes to find and protect Misha and resist Reunion
    infiltration. In Episode 6 the LGD and Rhodes jointly mop up Reunion in the city, but Wei Yenwu's secret use of the 'Black
    Suit' / 黑蓑 enforcers in the slums causes Ch'en and Rhodes to question Lungmen's methods.
  key_facts:
  - 陈 / Ch'en
  - 龙门 / Lungmen
  - 整合运动 / Reunion
  - 黑蓑 / Black Suit
