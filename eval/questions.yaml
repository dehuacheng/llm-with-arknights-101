  question_zh: 请简要介绍乌萨斯帝国和维多利亚分别是什么样的国家。
  question_en: Briefly describe the kind of state that Ursus and Victoria each represent on Terra.
  gold_zh: 乌萨斯帝国是泰拉北方一个以战争立国的多民族帝国，上任皇帝靠不断发动战争维系国家运转——切尔诺伯格事件就是其内部矛盾的爆发。维多利亚则位于西方，是另一个传统强国，但目前首都伦蒂尼姆被萨卡兹占领、内部诸公爵也分裂动荡。
  gold_en: Ursus is a northern multi-ethnic empire on Terra, sustained by continuous warfare under its previous emperor —
    the Chernobog incident is one explosion of those internal contradictions. Victoria is another major western power, but
    its capital Londinium is currently under Sarkaz occupation and its dukes are themselves divided.
  key_facts:
  - 乌萨斯 / Ursus
  - 北方 / north
  - 战争立国 / built on war
  - 维多利亚 / Victoria
  - 西方 / west
  - 伦蒂尼姆被占 / Londinium occupied
  traps:
  - 乌萨斯位于南方 / Ursus is in the south (wrong cardinal)
  - 维多利亚内部团结稳定 / Victoria is internally united and stable (off-canon)
  tags:
  - ursus
  - victoria
  - geography
  - world
  source: cn/stories/main_00.txt
  notes: Synthesised from main_00 + main_11 summaries and Kal'tsit's archive.
- id: Q074
  category: world
  answer_type: factoid
  difficulty: medium
  question_zh: 罗德岛医疗档案中，把一名干员判定为「非感染者」需要哪些指标都正常？
  question_en: Which medical metrics must come back clean for a Rhodes Island operator to be classified as "non-Infected"?
  gold_zh: 需要影像检测显示体内脏器无异常阴影、循环系统中源石颗粒检测正常，并且体细胞与源石融合率与血液源石结晶密度均处于正常范围。两组指标都必须达到非感染水平，才会被记为「非感染者」。
  gold_en: Imaging must show no abnormal Originium shadows in the organs, the circulatory-Originium-particle check must be
    normal, and both the cell-Originium fusion rate and blood-Originium crystal density must be within non-Infected ranges.
    All of these must come back clean for the "non-Infected" classification.
  key_facts:
  - 非感染者 / non-Infected
  - 造影无异常阴影 / no abnormal imaging shadows
  - 体细胞与源石融合率 / cell-Originium fusion rate
  - 血液源石结晶密度 / blood Originium crystal density
  traps:
  - 只需血液指标合格 / only the blood metric matters (partial truth)
  - 只需没有体表结晶 / only "no skin crystals" matters (off-canon)
  tags:
  - oripathy
  - medical
  - world
  source: cn/operators/char_102_texas.txt
  notes: ''
- id: Q075
  category: world
  answer_type: open_ended
  difficulty: medium
  question_zh: 「整合运动」与「罗德岛」都为感染者而战，本质区别在哪里？
  question_en: Reunion and Rhodes Island both fight for the Infected — what is the essential difference between them?
  gold_zh: 两者起初都为感染者而生，但方法不可调和。被科西切操控后的塔露拉领导下，整合运动以武装报复和无差别暴力（如切尔诺伯格对平民的袭击）回应不公；罗德岛则致力于医治矿石病、破除成见，弥合双方仇恨。第八章揭示，整合运动的暴力路线已被「黑蛇」诅咒扭曲离开了塔露拉的初衷。
  gold_en: Both began on behalf of the Infected, but their methods are incompatible. Under Talulah-as-Kaschey's-pawn, Reunion
    answered injustice with armed reprisal and indiscriminate violence (e.g. the civilian attacks at Chernobog). Rhodes Island
    instead treats Oripathy and works to break prejudice between Infected and non-Infected. Episode 8 reveals that the violent
    path had been twisted away from Talulah's original intention by the "Black Serpent" curse.
  key_facts:
  - 整合运动 / Reunion (armed reprisal)
  - 罗德岛 / Rhodes Island (treatment + bridging)
  - 科西切操控 / Kaschey's manipulation
  - 切尔诺伯格平民袭击 / Chernobog civilian attacks
  traps:
  - 二者本质相同，区别只是规模 / they are essentially identical, just at different scales (off-canon)
  - 罗德岛由乌萨斯帝国秘密资助 / Rhodes Island is secretly funded by the Ursus Empire (off-canon)
  tags:
  - reunion
  - rhodes_island
  - oripathy
  - world
  source: cn/stories/main_08.txt
  notes: ''
- id: Q076
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 罗德岛与巴别塔是什么关系？
  question_en: What is the relationship between Rhodes Island and Babel?
  gold_zh: 罗德岛是巴别塔的「继承者」。巴别塔由凯尔希与特蕾西娅共同建立，专注于团结萨卡兹与解决卡兹戴尔的困境；特蕾西娅死后，凯尔希遵照她的遗志将组织重新定位为治疗矿石病、收容感染者的罗德岛制药公司，是巴别塔议题的延续而非简单的重建。
  gold_en: Rhodes Island is Babel's successor. Babel was co-founded by Kal'tsit and Theresa to unite the Sarkaz and address
    Kazdel's crises; after Theresa's death, Kal'tsit honoured her wishes by reshaping the group into Rhodes Island Pharmaceuticals,
    focused on treating Oripathy and sheltering the Infected — a continuation of Babel's agenda, not a clean restart.
  key_facts:
  - 巴别塔 / Babel
  - 凯尔希 / Kal'tsit
  - 特蕾西娅 / Theresa
  - 矿石病议题 / Oripathy as new mission
  traps:
  - 罗德岛和巴别塔无关 / no relation between the two (false)
  - 罗德岛是巴别塔在哥伦比亚的分支 / Rhodes Island is Babel's Columbia branch (off-canon)
  tags:
  - rhodes_island
  - babel
  - kazdel
  source: cn/operators/char_003_kalts.txt
  notes: ''
- id: Q077
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 整合运动最初是由谁组建的？后来发生了什么转变？
  question_en: Who originally founded Reunion, and what changed afterward?
  gold_zh: 整合运动最初由塔露拉、爱国者与霜星等人在乌萨斯荒野中组建——塔露拉脱离科西切控制后救助感染者并结识阿丽娜，之后与爱国者、霜星合流。直到塔露拉被科西切的「不死的黑蛇」诅咒侵蚀，整合运动才沦为阴谋家的工具。
  gold_en: Reunion was originally founded by Talulah, the Patriot, and FrostNova in the Ursus wastes — Talulah, free of Kaschey,
    was rescuing Infected and met Alina, then linked up with the Patriot and FrostNova. Only after the "Undying Black Serpent"
    curse Kaschey had planted in Talulah took hold did Reunion become a schemer's tool.
  key_facts:
  - 塔露拉 / Talulah
  - 爱国者 / Patriot
  - 霜星 / FrostNova
  - 科西切 / Kaschey
  - 不死的黑蛇 / Undying Black Serpent
  traps:
  - 整合运动一开始就是科西切的傀儡组织 / Reunion was always Kaschey's puppet (over-specific)
  - 由凯尔希秘密扶植 / secretly seeded by Kal'tsit (off-canon)
  tags:
  - reunion
  - talulah
  - patriot
  - frostnova
  source: cn/stories/main_08.txt
  notes: Builds on Q005 (Reunion basic) without duplicating it.
- id: Q078
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 莱茵生命（Rhine Lab）是个什么样的公司？所在国是哪里？
  question_en: What kind of company is Rhine Lab, and where is it based?
  gold_zh: 莱茵生命是哥伦比亚的一家科研巨头，主营源石相关研究和矿石病临床试验，旗下多位研究员（如赫默）后来加入了罗德岛或与罗德岛合作。在泰拉的科技与源石应用领域，它拥有行业领先的话语权。
  gold_en: Rhine Lab is a Columbia-based scientific giant focused on Originium research and Oripathy clinical trials; several
    of its researchers (Silence/赫默 among them) later joined or collaborated with Rhodes Island. In Terra's tech and Originium-application
    industries, Rhine Lab carries industry-leading weight.
  key_facts:
  - 莱茵生命 / Rhine Lab
  - 哥伦比亚 / Columbia
  - 源石研究 / Originium research
  - 矿石病临床试验 / Oripathy clinical trials
  traps:
  - 莱茵生命是维多利亚王室的军工公司 / Rhine Lab is a Victorian crown arms company (wrong nation, wrong sector)
  - 莱茵生命不做矿石病临床研究 / Rhine Lab does not do Oripathy clinical work (false)
  tags:
  - rhine_lab
  - columbia
  - originium
  source: cn/operators/char_108_silent.txt
  notes: ''
- id: Q079
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 龙门近卫局（L.G.D.）在切尔诺伯格事件中扮演了什么角色？
  question_en: What role does the L.G.D. play across the Chernobog incident?
  gold_zh: 龙门近卫局是龙门的法律执行与城防机关。在第五章「靶向药物」中它联合罗德岛反击整合运动并夺回总部；在第八章「怒号光明」结尾，整合运动头目塔露拉就是被近卫局收监的。整个切尔诺伯格事件中，近卫局是龙门方面的主要执行单位。
  gold_en: The L.G.D. is Lungmen's law-enforcement and city-defence body. In Episode 5 it partners with Rhodes Island to push
    back Reunion and retake its HQ; at the end of Episode 8 it is the L.G.D. that takes Talulah into custody. Across the entire
    Chernobog arc, the L.G.D. is Lungmen's lead operational force.
  key_facts:
  - 龙门近卫局 / L.G.D.
  - 陈 / Ch'en
  - 夺回总部 / retakes HQ
  - 收监塔露拉 / imprisons Talulah
  traps:
  - 近卫局只是民事部门，没有参与战斗 / the L.G.D. is purely civil and does not fight (false)
  - 近卫局由企鹅物流代行职能 / Penguin Logistics fulfils the L.G.D.'s combat role (off-canon)
