- id: Q011
  category: relationship
  answer_type: factoid
  difficulty: easy
  question_zh: 凯尔希与阿米娅是什么关系？
  question_en: What is the relationship between Kal'tsit and Amiya?
  gold_zh: |
    凯尔希是阿米娅的监护人与导师，自巴别塔时期就陪伴并照料她长大，引导她
    控制魔王的力量。两人之间有着深厚的、近乎亲情的信赖关系。
  gold_en: |
    Kal'tsit is Amiya's guardian and mentor. She has cared for and raised
    Amiya since the Babel era and guides her in controlling the Demon Lord's
    power. The two share a deep, almost familial bond of trust.
  key_facts:
    - "监护人/导师 / guardian / mentor"
    - "巴别塔时期开始陪伴 / since the Babel era"
    - "引导控制魔王力量 / guides her in controlling the Demon Lord's power"
  traps: []
  tags: [amiya, kal-tsit, relationship, mentorship]
  source: char_v3/char_002_amiya.txt

