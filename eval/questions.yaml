  question_zh: 「内化宇宙」在第十四章中指的是什么？
  question_en: What does the 'Internalised Cosmos' refer to in Episode 14?
  gold_zh: 在第十四章中，源石仪式启动后，阿米娅一行坠入「源石的内化宇宙」——一个由九千年来萨卡兹「众魂」的记忆与遗憾构筑的幻景空间；众人在其中寻找出路，并最终在通天巨塔顶端面对特蕾西娅。
  gold_en: In Episode 14, once the Originium ritual is triggered, Amiya's group falls into the 'Internalised Cosmos' of Originium
    — a vision-space built from nine millennia of Sarkaz 'Many Souls' memories and regrets. They have to find a way through
    it, and ultimately face Theresa at the top of the Babel-spire.
