- id: Q003
  category: character
  answer_type: factoid
  difficulty: medium
  question_zh: 德克萨斯的真实身份是什么？她为什么会来到龙门？
  question_en: What is Texas's true identity, and why did she come to Lungmen?
  gold_zh: '德克萨斯是已覆灭的叙拉古显赫家族——德克萨斯家族的最后血脉。她在家族遭遇血腥

    覆灭后选择逃离故乡，来到龙门，在大帝的帮助下加入了企鹅物流。

    '
  gold_en: 'Texas is the last bloodline of the Texas family — a prominent Siracusan

    house that was bloodily destroyed. After her family''s fall, she fled her

    homeland for Lungmen, where she joined Penguin Logistics with help from

    Emperor.

    '
  key_facts:
  - 叙拉古 / Siracusa
  - 德克萨斯家族最后血脉 / last bloodline of the Texas family
  - 家族覆灭 / family was destroyed
  - 企鹅物流 / Penguin Logistics
  - 大帝 / Emperor (helper)
  traps: []
  tags:
  - texas
  - penguin-logistics
  - siracusa
  source: char_v3/char_102_texas.txt
- id: Q004
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 罗德岛是一家什么样的组织？它的核心目标是什么？
  question_en: What kind of organization is Rhodes Island, and what is its core mission?
  gold_zh: '罗德岛是一家制药公司，专注于研究和治疗矿石病。它同时也是一个收容感染者的

    武装组织，致力于弥合感染者与普通人之间的仇恨。罗德岛的前身是由特蕾西娅与

    凯尔希共同建立的巴别塔。

    '
  gold_en: 'Rhodes Island is a pharmaceutical company focused on researching and

    treating Oripathy. It is also an armed organization that shelters the

    Infected and works to bridge the hatred between the Infected and ordinary

    people. Its predecessor was Babel, co-founded by Theresa and Kal''tsit.

    '
  key_facts:
  - 制药公司 / pharmaceutical company
  - 矿石病 / Oripathy
  - 收容感染者 / shelters the Infected
  - 前身是巴别塔 / predecessor is Babel
  traps: []
  tags:
  - rhodes-island
  - organization
  source: cn/operators/
