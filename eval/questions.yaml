  gold_zh: 企鹅物流是一家以龙门为基地的快递公司，背后是一支精锐战斗队。它的代表干员是德克萨斯，公开身份是企鹅物流驻罗德岛的联络人员。公司常以接单的形式协助罗德岛的多项行动。
  gold_en: Penguin Logistics is a Lungmen-based courier company that fronts a small but elite combat team. Its signature operator
    is Texas, who is publicly the company's liaison stationed at Rhodes Island; many of its contracts double as cover for
    Rhodes Island operations.
