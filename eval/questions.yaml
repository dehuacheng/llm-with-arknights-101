    the Arknights canon.

- id: Q013
  category: refusal
  answer_type: refusal
  difficulty: easy
  question_zh: 法国的首都是哪里？这与罗德岛的总部有什么联系吗？
  question_en: What is the capital of France, and is there any connection to Rhodes Island's headquarters?
  gold_zh: ""
  gold_en: ""
  key_facts: []
  traps:
    # Connecting a real-world city to an in-fiction location is the failure.
    - "巴黎 / Paris (asserted as related to Rhodes Island)"
    - "罗德岛总部位于巴黎 / Rhodes Island HQ in Paris"
    - "罗德岛总部位于法国 / Rhodes Island HQ in France"
  tags: [refusal, real-world-wedge]
  source: ""
  notes: |
    Mixing real-world geography with Arknights canon. The Rhodes Island
    headquarters is a mobile ship; it is not on Earth or in France. The
    correct behavior is to separate the two domains (real-world: Paris;
    Arknights: not on Earth) or to decline the second half outright.

