  question_zh: 艾雅法拉的父母是怎样的人？他们是怎么去世的？
  question_en: Who were Eyjafjalla's parents, and how did they die?
  gold_zh: 档案资料二记载：她出生于莱塔尼亚一个学术氛围浓厚的家庭，父母都就职于莱塔尼亚威廉大学——父亲为源石技艺学院教授、研修生导师，母亲为自然环境与生态系统研究专家。二人曾共同起草关于泰拉天灾系统的调查项目，并在一次火山实地考察中遭遇火山碎屑流，不幸丧生。
  gold_en: 'Archive File II: she was born into an academic family in Leithanien; both parents worked at Leithanien William
    University — her father a Professor at the Originium-Arts Institute and graduate advisor, her mother a researcher in natural
    environments and ecology. They had co-drafted a project on Terra''s Catastrophe systems and were killed by pyroclastic
    flow during a volcanic field survey.'
