  difficulty: medium
  question_zh: 「矿石病」（Oripathy）感染者主要面临的三种风险是什么？
  question_en: What are the three main risks faced by people with Oripathy / 矿石病?
  gold_zh: 1) 身体结晶化与器官功能衰退（最终致死）；2) 严重的社会歧视——许多城市禁止感染者入境或限制其工作；3) 体内活性源石可能在死亡时再次扩散、引发周边二次感染（这也是大量城市拒收感染者的官方理由）。
  gold_en: 1) Bodily crystallisation and organ failure (eventually lethal); 2) severe social discrimination — many cities
    bar Infected from entry or restrict their employment; 3) the active Originium in their bodies can spread again upon death,
    causing secondary infections nearby (this is the official rationale many cities cite for refusing the Infected).
