  gold_zh: 二者是卡西米尔大骑士领并立的两大权力机构：商业联合会主导商业与娱乐（包括特锦赛与各骑士团的商业化），监正会则代表传统骑士秩序与法度。两者长期博弈；在「长夜临光」期间，商业联合会暗中支持无胄盟清洗感染者，而监正会一度协同罗德岛和临光家族出手平衡局势。
