  question_zh: 源石除了作为「魔法」的能源，还有什么实际用途？
  question_en: Beyond being the energy source for Arts, what practical role does Originium play in Terra?
  gold_zh: 源石广泛用作泰拉文明的能源——例如「源石引擎」即是基于源石提供动力的核心装置，整个泰拉的工业、城市运转都依赖源石。同时源石也是矿石病的源头，源石矿脉的开采本身就是高风险行业。
  gold_en: 'Originium is the backbone of Terran industry: "Originium Engines" power major machines, and entire cities and
    industries run on it. The same stone is also the root cause of Oripathy, which makes mining operations inherently hazardous.'
