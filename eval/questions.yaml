- id: Q197
  category: world
  answer_type: open_ended
  difficulty: medium
  question_zh: 请说明源石尘埃与天灾、矿石病之间的因果关系。
  question_en: Explain the causal chain among Originium dust, Catastrophes, and Oripathy.
  gold_zh: 天灾（特别是源石尘暴类天灾）会将大量带活性的源石尘埃扬入大气与地表；这些尘埃长期吸入或接触会使易感个体罹患矿石病；矿石病感染者死亡后体内的活性源石又会再次扩散，可在密集区域引发二次感染。因此，天灾不仅是物理灾难，也是大规模公共卫生灾难。
  gold_en: Catastrophes — especially Originium-dust storms — stir vast amounts of active Originium dust into the air and across
    the ground. Long-term inhalation or contact with this dust gives susceptible individuals Oripathy. When the Infected die,
    the active Originium in their bodies disperses again, potentially triggering secondary infections in dense areas. Catastrophes
    are therefore both physical disasters and large-scale public-health disasters.
  key_facts:
  - 源石尘埃 / Originium dust
  - 天灾 / Catastrophe
  - 矿石病 / Oripathy
  - 二次感染 / secondary infection
  traps:
  - 矿石病只通过血液传播 / Oripathy only transmits via blood (false — dust/contact dominates)
  - 天灾与矿石病无关 / Catastrophes are unrelated to Oripathy (false — they are a major driver)
  tags:
  - originium
  - catastrophe
  - oripathy
  - world
  source: cn/stories/main_00.txt
  notes: ''
- id: Q198
