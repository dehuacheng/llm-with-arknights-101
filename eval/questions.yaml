  question_zh: 源石技艺的代价是什么？和矿石病有什么关系？
  question_en: What is the cost of using Originium Arts, and how does it relate to Oripathy?
  gold_zh: 源石技艺以源石为能量源，使用者通过自身与源石的共鸣来引发现象。代价是与源石长期接触会显著提高矿石病的感染风险，许多术师本身就是感染者，或主动承受了这种风险。
  gold_en: Originium Arts use Originium itself as their energy source, with the caster channelling through resonance with
    the stone. The cost is that prolonged contact with Originium sharply raises the risk of Oripathy — many casters are themselves
    Infected, or accept that risk knowingly.
  key_facts:
  - 源石 / Originium (energy source)
  - 源石技艺 / Arts
  - 矿石病感染风险 / risk of Oripathy
  traps:
  - 源石技艺消耗的是生命力，与源石无关 / Arts consume the user's life force, not Originium (off-canon)
  - 源石技艺与矿石病没有任何联系 / no link between Arts and Oripathy (false)
  tags:
