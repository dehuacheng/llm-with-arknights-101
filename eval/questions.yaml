- id: Q001
  category: character
  answer_type: factoid
  difficulty: easy
  question_zh: 罗德岛的公开领袖是谁？她的种族是什么？
  question_en: Who is the public leader of Rhodes Island, and what is her race?
  gold_zh: '阿米娅。她是出身于雷姆必拓的卡特斯/奇美拉感染者，同时也是萨卡兹的新一任“魔王”，

    继承自特蕾西娅。

    '
  gold_en: 'Amiya. She is a Cautus/Chimera Infected born in Rim Billiton, and also the

    new Sarkaz "Demon Lord" — a title inherited from Theresa.

    '
  key_facts:
  - 阿米娅 / Amiya
  - 罗德岛公开领袖 / public leader of Rhodes Island
  - 卡特斯 / Cautus (race)
  - 魔王 / Demon Lord
