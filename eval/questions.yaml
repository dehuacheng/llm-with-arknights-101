  question_zh: 拉普兰德与德克萨斯之间有什么过去？
  question_en: What is the shared history between Lappland and Texas?
  gold_zh: 拉普兰德与德克萨斯出身叙拉古的同一鲁珀文化圈，是德克萨斯七年前事件中失去家族前的旧识。如今拉普兰德对德克萨斯怀有近乎执念的关注，而德克萨斯则有意回避与她正面碰撞——双方在罗德岛行动中即便合作，也维持着「若即若离」的微妙关系，这种关系部分源于德克萨斯对自身、对家族、对乔万娜与拉普兰德三种命运的复杂情感。
  gold_en: Lappland and Texas come from the same Lupo-Siracusan cultural circle and were acquaintances before the seven-years-ago
