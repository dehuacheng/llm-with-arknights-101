    # a canonical Arknights operator.
    - "罗德岛 / Rhodes Island"
    - "龙门近卫局 / Lungmen Guard Department"
    - "企鹅物流 / Penguin Logistics"
    - "皮肤 / signature skin (specific named skin)"
  tags: [refusal, out-of-canon, character]
