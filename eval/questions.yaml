    avoids direct confrontation. Even when they cooperate on Rhodes Island operations, they hold an ambiguous 'near-but-distant'
    relationship, partly rooted in Texas's complicated feelings about herself, her family, and the three possible fates she
    sees in Texas, Giovanna, and Lappland.
