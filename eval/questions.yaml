  gold_zh: 自救军在第十二章作为伦蒂尼姆抵抗萨卡兹军事委员会的核心力量之一，与罗德岛、推进之王(维娜)所率格拉斯哥帮共同行动，在诺伯特区救援平民、调查萨卡兹的新型武器。第十三章中，温德米尔公爵牺牲后，推进之王集结残兵与难民建立「典范军」，自救军与之合并展开反击，参与挫败血魔大君在布伦特伍德的血祭。
  gold_en: In Episode 12 the Self-Salvation Army is one of the core resistance forces in Lundinium against the Sarkaz Military
    Commission, operating alongside Rhodes Island and the Crown Prince (Penance / 推进之王)'s Glasgow Gang to evacuate civilians
    and investigate Sarkaz new weapons in Norport. In Episode 13, after the Duke of Windermere falls, the Crown Prince consolidates
    the remnants and refugees into the 'Exemplar Army'; the Self-Salvation Army merges with it to fight back and helps thwart
    the Blood Lord's blood-rite at Brentwood.
