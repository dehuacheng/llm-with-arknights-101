- id: Q009
  category: event
  answer_type: open_ended
  difficulty: medium
  question_zh: 切尔诺伯格事件中发生了什么？罗德岛在其中扮演了什么角色？
  question_en: What happened in the Chernobog incident, and what role did Rhodes Island play in it?
  gold_zh: |
    切尔诺伯格是乌萨斯帝国的移动城市，是整合运动发动大规模武装行动的起点。
    博士在此地从石棺中苏醒并失忆。罗德岛介入战局，与整合运动正面冲突；事件
    最终以塔露拉的看似败亡和切尔诺伯格被天灾摧毁告终。
  gold_en: |
    Chernobog was a mobile city of the Ursus Empire, where Reunion launched
    a large-scale armed uprising. The Doctor awoke from cryosleep there with
    memory loss. Rhodes Island intervened and clashed directly with Reunion;
    the arc ended with Talulah's apparent defeat and the city's destruction
    by a Catastrophe.
  key_facts:
    - "切尔诺伯格 / Chernobog"
    - "乌萨斯城市 / Ursus city"
    - "整合运动起点 / Reunion's uprising"
    - "博士在此苏醒 / Doctor awoke here"
    - "城市被天灾摧毁 / city destroyed by Catastrophe"
  traps: []
  tags: [chernobog, main-story, reunion, doctor]
  source: cn/stories/main-chapters

- id: Q010
  category: event
  answer_type: factoid
  difficulty: medium
  question_zh: 巴别塔是什么组织？它最终是如何结束的？
  question_en: What was Babel, and how did it end?
  gold_zh: |
    巴别塔是罗德岛的前身，由卡兹戴尔的萨卡兹魔王特蕾西娅与凯尔希共同建立，
    旨在为感染者和萨卡兹谋求和平的家园。在特蕾西娅遭遇刺杀后，巴别塔覆灭，
    残部由凯尔希与年幼的阿米娅带领，改组为罗德岛。
  gold_en: |
    Babel was Rhodes Island's predecessor, co-founded by the Sarkaz Demon Lord
    of Kazdel — Theresa — and Kal'tsit, aiming to secure a peaceful home for
    the Infected and the Sarkaz. After Theresa's assassination, Babel fell;
    its remnants were led by Kal'tsit and the young Amiya, who reorganized
    them into Rhodes Island.
  key_facts:
    - "罗德岛的前身 / Rhodes Island's predecessor"
    - "特蕾西娅 / Theresa"
    - "凯尔希 / Kal'tsit"
    - "特蕾西娅遭刺杀 / Theresa was assassinated"
    - "改组为罗德岛 / reorganized into Rhodes Island"
  traps: []
  tags: [babel, theresa, kazdel, sarkaz]
  source: char_v3/char_003_kalts.txt

