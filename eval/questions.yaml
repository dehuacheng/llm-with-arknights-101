  question_zh: 卡兹戴尔是什么？它和罗德岛有什么联系？
  question_en: What is Kazdel, and how is it connected to Rhodes Island?
  gold_zh: 卡兹戴尔是萨卡兹族的故土，长期处于战乱与分裂之中。罗德岛的前身巴别塔正是凯尔希与卡兹戴尔的「魔王」特蕾西娅共同建立的，目的是团结萨卡兹族；特蕾西娅死后，凯尔希带领幸存者离开卡兹戴尔，转向「治疗矿石病」这个更广义的议题，这就是罗德岛的源头。
  gold_en: Kazdel is the Sarkaz homeland, long in war and fragmentation. Rhodes Island's predecessor Babel was co-founded
    by Kal'tsit and Kazdel's "Demon Lord" Theresa to unite the Sarkaz; after Theresa's death Kal'tsit led the survivors out
    of Kazdel and reframed their mission as treating Oripathy in general — and that is the origin of Rhodes Island.
  key_facts:
