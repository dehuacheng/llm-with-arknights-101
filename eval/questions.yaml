  gold_zh: 档案二说铳是一种构造独特的中远距离杀伤武器，据传最先由拉特兰人发现。它的杀伤力并不十分出色，但比起冷兵器更契合拉特兰人的习性，因此成为大部分拉特兰人的首选武器，每个拉特兰人都会有至少一把守护铳。
