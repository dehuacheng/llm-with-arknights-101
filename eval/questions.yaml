# Shared evaluation set for the llm-with-arknights-101 project.
# Hand-authored, CC-BY-4.0 (see LICENSE). Schema: see schema.md.
#
# Seed authoring batch (15 / ~200) — covers every category, answer_type, and
# difficulty so the schema is exercised end-to-end before the set is grown.
#
# Conventions (see schema.md for full doc):
#   - id: zero-padded contiguous (Q001 …)
#   - key_facts: one independent fact per bullet, bilingual "中文 / English"
#   - source: cn/ ground truth where possible; char_v3/ only when the wiki
#             summary is faithful to the underlying cn/ facts
#   - gold_*: empty string "" for refusal items

