- id: Q237
  category: relationship
  answer_type: open_ended
  difficulty: hard
  question_zh: 塞雷娅与克丽斯腾相比，作为莱茵生命总辖的工作风格有何差异？
  question_en: How does Saria's leadership style as Rhine Lab Director differ from Kristen's?
  gold_zh: 秘书海伦的视角对比：克丽斯腾「神出鬼没」、办公室里几年都难得见上十次面、并不关心自己创造的许多事；塞雷娅则是出名的务实派，上任首日同时处理多项业务、亲自验证项目、用拳击台面试员工。但海伦也指出二人本质相似——「莱茵生命事实上并不重要」，二者都被某种「伟大」的光芒所吸引。
  gold_en: 'Through secretary Helen''s eyes: Kristen was elusive, seldom seen in the office over years, and ''didn''t care
    about much of what she had created''; Saria is famously hands-on — handling multiple business threads from day one, personally
    vetting projects, even interviewing recruits in her boxing ring. Yet Helen notes a deeper similarity: ''Rhine Lab is in
    fact not what matters to either of them'' — both are drawn to the same cold light of ''greatness.'''
  key_facts:
  - 克丽斯腾神出鬼没 / Kristen was elusive
  - 塞雷娅务实/亲自处理 / Saria is hands-on
  - 拳击台面试 / boxing-ring interview
  - 都被「伟大」吸引 / both drawn to 'greatness'
  traps:
  - 塞雷娅与克丽斯腾性格毫无相似 / Saria and Kristen share no traits (incomplete — secretary Helen names the shared core)
  - 塞雷娅延续克丽斯腾的怠惰风格 / Saria continues Kristen's slack style (canon-swap — the opposite is true)
  tags:
  - saria
  - kristen
  - rhine_lab
  - leadership
  source: cn/stories/story_demkni_set_1.txt
  notes: Saria sidestory '沃土' — dialogue between Helen and Dorothy.
