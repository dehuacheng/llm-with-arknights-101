  gold_en: The Self-Salvation Army is a Victorian resistance group, operating largely from the underground of Sarkaz-occupied
    Londinium. They partner with Rhodes Island across Episodes 10 and 11 to undermine the Sarkaz Military Committee's weapons
    threat and rescue civilians. Aletta, Fester and the courier Heidi are among its members.
  key_facts:
