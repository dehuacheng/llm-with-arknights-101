- id: Q006
  category: world
  answer_type: factoid
  difficulty: easy
  question_zh: 源石是什么？它有什么作用？
  question_en: What is Originium, and what does it do?
  gold_zh: '源石是泰拉大陆上一种神秘的矿物。它是源石技艺（魔法）的能量源，但与之接触

    也会导致矿石病。源石广泛存在于泰拉，并由天灾在大陆上扩散。

    '
  gold_en: 'Originium is a mysterious mineral found across Terra. It is the energy

    source for Arts (Originium magic), but contact with it also causes

    Oripathy. It is widespread across Terra and is spread further by

    Catastrophes.

    '
  key_facts:
  - 矿物 / mineral
  - 源石技艺/魔法能量源 / energy source for Arts (magic)
  - 导致矿石病 / causes Oripathy
  - 由天灾扩散 / spread by Catastrophes
  traps: []
  tags:
  - originium
  - world-concept
  source: cn/stories/
- id: Q007
  category: world
  answer_type: factoid
  difficulty: medium
  question_zh: 矿石病是如何传播的？被感染的人有什么社会处境？
  question_en: How is Oripathy transmitted, and what is the social situation of the Infected?
  gold_zh: '矿石病主要通过直接接触源石或源石尘粒传播；感染者的体液与血液在特定条件下

    也具有传染性。被感染者被称为"感染者"，在泰拉大陆上普遍受到歧视与排斥，

    许多国家会限制其行动甚至将其驱逐或杀害。

    '
  gold_en: 'Oripathy is primarily transmitted through direct contact with Originium

    or Originium dust; the bodily fluids and blood of the Infected are also

    transmissible under certain conditions. The Infected are widely

    discriminated against and ostracized across Terra; many states restrict

    their movement or expel and kill them.

    '
  key_facts:
  - 接触源石/源石尘粒传播 / transmitted via Originium contact
  - 感染者 / the Infected
  - 普遍受到歧视 / widely discriminated against
  traps:
  - 空气传播 / airborne transmission
  tags:
  - oripathy
  - infected
  - discrimination
  source: cn/stories/
- id: Q008
  category: world
  answer_type: factoid
  difficulty: easy
  question_zh: 什么是"天灾"？它对泰拉文明产生了什么影响？
  question_en: What is a "Catastrophe", and how has it shaped Terran civilization?
  gold_zh: '天灾是泰拉大陆上无法预测的大规模自然灾害，会摧毁城市、迫使人口迁徙，并在

    大陆上扩散源石。为了应对天灾，泰拉的许多城市都建造成了可移动的形态。

    '
  gold_en: 'A Catastrophe is an unpredictable large-scale natural disaster on Terra

    that destroys cities, forces mass migration, and spreads Originium across

    the continent. Many Terran cities are built to be mobile in response.

    '
  key_facts:
  - 大规模自然灾害 / large-scale natural disaster
  - 摧毁城市 / destroys cities
  - 扩散源石 / spreads Originium
  - 城市移动化 / cities are mobile
  traps: []
  tags:
  - catastrophe
  - terra
  - world-concept
  source: cn/stories/
- id: Q009
  category: event
  answer_type: open_ended
  difficulty: medium
  question_zh: 切尔诺伯格事件中发生了什么？罗德岛在其中扮演了什么角色？
  question_en: What happened in the Chernobog incident, and what role did Rhodes Island play in it?
  gold_zh: '切尔诺伯格是乌萨斯帝国的移动城市，是整合运动发动大规模武装行动的起点。

    博士在此地从石棺中苏醒并失忆。罗德岛介入战局，与整合运动正面冲突；事件

    最终以塔露拉的看似败亡和切尔诺伯格被天灾摧毁告终。

    '
  gold_en: 'Chernobog was a mobile city of the Ursus Empire, where Reunion launched

    a large-scale armed uprising. The Doctor awoke from cryosleep there with

    memory loss. Rhodes Island intervened and clashed directly with Reunion;

    the arc ended with Talulah''s apparent defeat and the city''s destruction

    by a Catastrophe.

    '
  key_facts:
  - 切尔诺伯格 / Chernobog
  - 乌萨斯城市 / Ursus city
  - 整合运动起点 / Reunion's uprising
  - 博士在此苏醒 / Doctor awoke here
  - 城市被天灾摧毁 / city destroyed by Catastrophe
  traps: []
  tags:
  - chernobog
  - main-story
  - reunion
  - doctor
  - stage05-failed
  source: cn/stories/main-chapters
- id: Q010
  category: event
  answer_type: factoid
  difficulty: medium
  question_zh: 巴别塔是什么组织？它最终是如何结束的？
  question_en: What was Babel, and how did it end?
  gold_zh: '巴别塔是罗德岛的前身，由卡兹戴尔的萨卡兹魔王特蕾西娅与凯尔希共同建立，

    旨在为感染者和萨卡兹谋求和平的家园。在特蕾西娅遭遇刺杀后，巴别塔覆灭，

    残部由凯尔希与年幼的阿米娅带领，改组为罗德岛。

    '
  gold_en: 'Babel was Rhodes Island''s predecessor, co-founded by the Sarkaz Demon Lord

    of Kazdel — Theresa — and Kal''tsit, aiming to secure a peaceful home for

    the Infected and the Sarkaz. After Theresa''s assassination, Babel fell;

    its remnants were led by Kal''tsit and the young Amiya, who reorganized

    them into Rhodes Island.

    '
  key_facts:
  - 罗德岛的前身 / Rhodes Island's predecessor
  - 特蕾西娅 / Theresa
  - 凯尔希 / Kal'tsit
  - 特蕾西娅遭刺杀 / Theresa was assassinated
  - 改组为罗德岛 / reorganized into Rhodes Island
  traps: []
  tags:
  - babel
  - theresa
  - kazdel
  - sarkaz
  source: char_v3/char_003_kalts.txt
