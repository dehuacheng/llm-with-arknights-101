- id: Q006
  category: world
  answer_type: factoid
  difficulty: easy
  question_zh: 源石是什么？它有什么作用？
  question_en: What is Originium, and what does it do?
  gold_zh: |
    源石是泰拉大陆上一种神秘的矿物。它是源石技艺（魔法）的能量源，但与之接触
    也会导致矿石病。源石广泛存在于泰拉，并由天灾在大陆上扩散。
  gold_en: |
    Originium is a mysterious mineral found across Terra. It is the energy
    source for Arts (Originium magic), but contact with it also causes
    Oripathy. It is widespread across Terra and is spread further by
    Catastrophes.
  key_facts:
    - "矿物 / mineral"
    - "源石技艺/魔法能量源 / energy source for Arts (magic)"
    - "导致矿石病 / causes Oripathy"
    - "由天灾扩散 / spread by Catastrophes"
  traps: []
  tags: [originium, world-concept]
  source: cn/stories/

- id: Q007
  category: world
  answer_type: factoid
  difficulty: medium
  question_zh: 矿石病是如何传播的？被感染的人有什么社会处境？
  question_en: How is Oripathy transmitted, and what is the social situation of the Infected?
  gold_zh: |
    矿石病主要通过直接接触源石或源石尘粒传播；感染者的体液与血液在特定条件下
    也具有传染性。被感染者被称为"感染者"，在泰拉大陆上普遍受到歧视与排斥，
    许多国家会限制其行动甚至将其驱逐或杀害。
  gold_en: |
    Oripathy is primarily transmitted through direct contact with Originium
    or Originium dust; the bodily fluids and blood of the Infected are also
    transmissible under certain conditions. The Infected are widely
    discriminated against and ostracized across Terra; many states restrict
    their movement or expel and kill them.
  key_facts:
    - "接触源石/源石尘粒传播 / transmitted via Originium contact"
    - "感染者 / the Infected"
    - "普遍受到歧视 / widely discriminated against"
  traps:
    # Common false belief — Oripathy is not airborne person-to-person.
    - "空气传播 / airborne transmission"
  tags: [oripathy, infected, discrimination]
  source: cn/stories/

- id: Q008
  category: world
  answer_type: factoid
  difficulty: easy
  question_zh: 什么是"天灾"？它对泰拉文明产生了什么影响？
  question_en: What is a "Catastrophe", and how has it shaped Terran civilization?
  gold_zh: |
    天灾是泰拉大陆上无法预测的大规模自然灾害，会摧毁城市、迫使人口迁徙，并在
    大陆上扩散源石。为了应对天灾，泰拉的许多城市都建造成了可移动的形态。
  gold_en: |
    A Catastrophe is an unpredictable large-scale natural disaster on Terra
    that destroys cities, forces mass migration, and spreads Originium across
    the continent. Many Terran cities are built to be mobile in response.
  key_facts:
    - "大规模自然灾害 / large-scale natural disaster"
    - "摧毁城市 / destroys cities"
    - "扩散源石 / spreads Originium"
    - "城市移动化 / cities are mobile"
  traps: []
  tags: [catastrophe, terra, world-concept]
  source: cn/stories/

