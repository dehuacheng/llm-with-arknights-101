- id: Q004
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 罗德岛是一家什么样的组织？它的核心目标是什么？
  question_en: What kind of organization is Rhodes Island, and what is its core mission?
  gold_zh: |
    罗德岛是一家制药公司，专注于研究和治疗矿石病。它同时也是一个收容感染者的
    武装组织，致力于弥合感染者与普通人之间的仇恨。罗德岛的前身是由特蕾西娅与
    凯尔希共同建立的巴别塔。
  gold_en: |
    Rhodes Island is a pharmaceutical company focused on researching and
    treating Oripathy. It is also an armed organization that shelters the
    Infected and works to bridge the hatred between the Infected and ordinary
    people. Its predecessor was Babel, co-founded by Theresa and Kal'tsit.
  key_facts:
    - "制药公司 / pharmaceutical company"
    - "矿石病 / Oripathy"
    - "收容感染者 / shelters the Infected"
    - "前身是巴别塔 / predecessor is Babel"
  traps: []
  tags: [rhodes-island, organization]
  source: cn/operators/

- id: Q005
  category: faction
  answer_type: factoid
  difficulty: medium
  question_zh: 整合运动的领导者是谁？这个组织的核心诉求是什么？
  question_en: Who led Reunion, and what was its core demand?
  gold_zh: |
    整合运动由塔露拉领导，是一个由感染者组成的武装独立运动。它以暴力反抗
    乌萨斯帝国对感染者的压迫与歧视为核心诉求。
  gold_en: |
    Reunion was led by Talulah. It was an armed Infected separatist movement
    whose core demand was violent resistance to the Ursus Empire's
    oppression and discrimination of the Infected.
  key_facts:
    - "塔露拉 / Talulah"
    - "感染者武装运动 / armed Infected movement"
    - "反抗乌萨斯帝国 / against the Ursus Empire"
    - "反对歧视感染者 / against discrimination of the Infected"
  traps: []
  tags: [reunion, talulah, ursus]
  source: cn/stories/main-chapters

