# Stage 06 — RLVR v2 (corrected baseline after grpo_baseline mode-collapse).
#
# Three knob changes vs grpo_baseline (see 06_rlvr/docs/RESULTS.md
# §"Next cell" for diagnosis):
#   1. beta:  0.04 → 0.10   (2.5× KL anchor; matches Stage 05 DPO strength)
#   2. lr:    5e-6 → 1e-6   (5× lower; standard PPO range)
#   3. fluency_penalty_cap: 0.0 → 0.3  (additive penalty on responses with
#       < 70% on-topic CJK+Latin chars; addresses baseline's tolerance for
#       Russian/kana noise tokens leaking into responses)
#
# Everything else is identical to grpo_baseline.yaml. This is a one-axis
# diagnostic: did the three named fixes hold KL bounded and let
# val_reward climb past noise?
name: grpo_v2

base_model: data/checkpoints/sft_full

train_file: data/rl/prompts_train.jsonl
val_file:   data/rl/prompts_val.jsonl

dtype: bfloat16
seed: 1337

n_samples: 8
temperature: 1.0
top_p: 0.9
max_new_tokens: 128

trap_weight: 0.5
length_penalty_threshold: 2.0
length_penalty_rate: 0.1

# --- NEW: fluency penalty (was 0.0 / disabled in baseline) ---
fluency_threshold: 0.7
fluency_penalty_cap: 0.3

refusal_phrases:
  - "无法回答"
  - "档案中没有"
  - "未明确记载"
  - "没有相关记录"
  - "我不知道"

beta: 0.10                    # CHANGED — was 0.04
clip_epsilon: 0.2

learning_rate: 1.0e-6         # CHANGED — was 5.0e-6
weight_decay: 0.0
warmup_steps: 20
grad_clip: 1.0

batch_size: 2
grad_accum: 4
max_steps: 2000
eval_interval: 50
eval_samples_per_val_prompt: 4
patience: 5

kl_hard_cap: 0.5
kl_max_hard_cap: 2.0
sft_drift_hard_cap: 1.0

gradient_checkpointing: true

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
