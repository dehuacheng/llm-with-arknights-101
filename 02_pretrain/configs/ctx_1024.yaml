# Stage 02 experiment config. Clone for a new run — never edit in place.
#
# Context axis, block 1024 of {256, 512, 1024, 2048, 4096} — see
# 02_pretrain/README.md. Fixes scale=small and tokenizer=vocab_32k; only
# block_size varies down this axis. small_32k.yaml is the block-512 point.
name: ctx_1024

# Which stage-01 tokenizer feeds the model — data/tokenizers/<tokenizer>/.
tokenizer: vocab_32k

# Architecture — a scale preset (lib/model.SCALE_PRESETS) + context window.
scale: small          # tiny | small | large
block_size: 1024
dropout: 0.1

# Optimisation. Effective batch = batch_size x grad_accum = 32, held constant
# across the whole sweep. A 1024-token window halves the micro-batch that fits
# in VRAM, so gradient accumulation rebuilds the effective batch of 32. The LR
# is constant after warmup; each run trains until val loss stops improving for
# `patience` evals (early stopping). max_steps is only a safety cap.
batch_size: 16        # micro-batch — what is resident on the GPU at once
grad_accum: 2         # micro-batches summed per optimiser step
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 15000
warmup_steps: 200
patience: 10          # evals without val improvement before early-stopping
grad_clip: 1.0

# Evaluation cadence + RNG seed.
eval_interval: 250
eval_steps: 100
seed: 1337
