# Stage 02 experiment config. Clone for a new run — never edit in place.
#
# Context axis, block 4096 of {256, 512, 1024, 2048, 4096} — see
# 02_pretrain/README.md. Fixes scale=small and tokenizer=vocab_32k; only
# block_size varies down this axis. small_32k.yaml is the block-512 point.
#
# The longest context: a 4096-token window is ~7700 characters, often a whole
# short story. Attention is the memory bottleneck, so the micro-batch is small
# (peak ~17 GB) and gradient accumulation rebuilds the effective batch of 32.
name: ctx_4096

# Which stage-01 tokenizer feeds the model — data/tokenizers/<tokenizer>/.
tokenizer: vocab_32k

# Architecture — a scale preset (lib/model.SCALE_PRESETS) + context window.
scale: small          # tiny | small | large
block_size: 4096
dropout: 0.1

# Optimisation. Effective batch = batch_size x grad_accum = 32, held constant
# across the whole sweep. The LR is constant after warmup; each run trains
# until val loss stops improving for `patience` evals (early stopping), so
# every run is compared at its own optimum. max_steps is only a safety cap.
batch_size: 2         # micro-batch — what is resident on the GPU at once
grad_accum: 16        # micro-batches summed per optimiser step
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 4000
warmup_steps: 60
patience: 10          # evals without val improvement before early-stopping
grad_clip: 1.0

# Evaluation cadence + RNG seed.
eval_interval: 75
eval_steps: 100
seed: 1337
