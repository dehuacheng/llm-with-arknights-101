# Stage 02 experiment config. Clone for a new run — never edit in place.
#
# Scale axis, point 1 of 3: the smallest model. Compare against small_32k /
# large_32k — same tokenizer, same optimisation, only `scale` differs.
name: tiny_32k

# Which stage-01 tokenizer feeds the model — data/tokenizers/<tokenizer>/.
tokenizer: vocab_32k

# Architecture — a scale preset (lib/model.SCALE_PRESETS) + context window.
scale: tiny           # tiny | small | large
block_size: 512
dropout: 0.1

# Optimisation. Effective batch = batch_size x grad_accum = 32, held constant
# across the whole sweep. The LR is constant after warmup; each run trains
# until val loss stops improving for `patience` evals (early stopping), so
# every run is compared at its own optimum. max_steps is only a safety cap.
batch_size: 32
grad_accum: 1
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 30000
warmup_steps: 400
patience: 10          # evals without val improvement before early-stopping
grad_clip: 1.0

# Evaluation cadence + RNG seed.
eval_interval: 500
eval_steps: 100
seed: 1337
