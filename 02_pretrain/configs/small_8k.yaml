# Stage 02 experiment config. Clone for a new run — never edit in place.
#
# Vocab axis, point 1 of 3: the smallest vocabulary. Same `scale` as
# small_16k / small_32k — only the tokenizer differs. A smaller vocab means a
# smaller embedding table but longer token sequences per document. Perplexity
# is NOT comparable across vocabs; compare bits-per-character instead.
name: small_8k

# Which stage-01 tokenizer feeds the model — data/tokenizers/<tokenizer>/.
tokenizer: vocab_8k

# Architecture — a scale preset (lib/model.SCALE_PRESETS) + context window.
scale: small          # tiny | small | large
block_size: 512
dropout: 0.1

# Optimisation — held constant across the whole sweep so the comparison is
# fair: every run sees the same number of tokens (max_steps x batch x block).
batch_size: 32
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 8000
warmup_steps: 300
grad_clip: 1.0

# Evaluation cadence + RNG seed.
eval_interval: 500
eval_steps: 100
seed: 1337
