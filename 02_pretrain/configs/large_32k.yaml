# Stage 02 experiment config. Clone for a new run — never edit in place.
#
# Scale axis, point 3 of 3: the largest model. Watch the val perplexity here
# — on a ~10M-token corpus the larger model is the one most likely to overfit
# (train loss keeps falling while val stops improving).
name: large_32k

# Which stage-01 tokenizer feeds the model — data/tokenizers/<tokenizer>/.
tokenizer: vocab_32k

# Architecture — a scale preset (lib/model.SCALE_PRESETS) + context window.
scale: large          # tiny | small | large
block_size: 512
dropout: 0.1

# Optimisation — held constant across the whole sweep so the comparison is
# fair: every run sees the same number of tokens (max_steps x batch x block).
batch_size: 32
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 8000
warmup_steps: 300
grad_clip: 1.0

# Evaluation cadence + RNG seed.
eval_interval: 500
eval_steps: 100
seed: 1337
