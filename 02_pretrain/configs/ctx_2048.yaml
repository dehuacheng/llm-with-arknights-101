# Stage 02 experiment config. Clone for a new run — never edit in place.
#
# Context axis, block 2048 of {256, 512, 1024, 2048, 4096} — see
# 02_pretrain/README.md. Fixes scale=small and tokenizer=vocab_32k; only
# block_size (and the batch/step accounting that keeps the token budget fair)
# varies down this axis. small_32k.yaml is the block-512 point.
name: ctx_2048

# Which stage-01 tokenizer feeds the model — data/tokenizers/<tokenizer>/.
tokenizer: vocab_32k

# Architecture — a scale preset (lib/model.SCALE_PRESETS) + context window.
scale: small          # tiny | small | large
block_size: 2048
dropout: 0.1

# Optimisation. Effective batch = batch_size x grad_accum = 32, held constant
# across the context axis; max_steps is scaled so every run still sees the
# same ~131M tokens (effective_batch x block_size x max_steps).
batch_size: 4         # micro-batch — what is resident on the GPU at once
grad_accum: 8         # micro-batches summed per optimiser step
learning_rate: 3.0e-4
weight_decay: 0.1
max_steps: 2000
warmup_steps: 75
grad_clip: 1.0

# Evaluation cadence + RNG seed.
eval_interval: 125
eval_steps: 100
seed: 1337
