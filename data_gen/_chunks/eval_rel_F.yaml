- id: Q014
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 银灰、崖心、初雪是什么关系？
  question_en: How are SilverAsh, Cliffheart and Pramanix related?
  gold_zh: 三人是希瓦艾什家的兄妹。银灰是兄长，崖心（本名恩希亚）是幺妹、感染了矿石病并在罗德岛接受医治；初雪是长妹，在宗教仪式中被选作喀兰圣女，连兄长在公开场合见到她时也必须合掌行礼。
  gold_en: They are siblings of the Silverash family. SilverAsh is the elder brother; Cliffheart (real name Enciodes) is the
    youngest sister, Oripathy-infected and under treatment at Rhodes Island; Pramanix is the elder sister, chosen as Karlan
    Saintess in a religious rite — so even her brother, the nominal head of Kjerag, must press his palms together to greet
    her in public.
  key_facts:
  - 希瓦艾什家族 / Silverash family
  - 银灰是兄长 / SilverAsh is the elder brother
  - 崖心是幺妹/感染矿石病 / Cliffheart is youngest sister, Oripathy-infected
  - 初雪是长妹/喀兰圣女 / Pramanix is elder sister, the Karlan Saintess
  traps:
  - 三人都是堂亲 / they are cousins (false — they are siblings)
  - 崖心是长姐 / Cliffheart is the eldest (swap — Cliffheart is youngest)
  tags:
  - silverash
  - cliffheart
  - pramanix
  - kjerag
  - siblings
  source: cn/operators/char_172_svrash.txt
  notes: Baked relations char_172_svrash family_of with 崖心/恩希亚/初雪.
- id: Q015
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 斯卡蒂与幽灵鲨、歌蕾蒂娅是什么关系？
  question_en: How are Skadi, Specter, and Gladiia related?
  gold_zh: 三人都来自阿戈尔，都是「深海猎人」。斯卡蒂与幽灵鲨的若干动作十分相似，被视为同伴；歌蕾蒂娅是深海猎人总战争设计师之一，更是这一群体的核心。
  gold_en: All three are Aegirians and members of the Abyssal Hunters. Skadi and Specter share strikingly similar movements
    and are treated as comrades; Gladiia is one of the Abyssal Hunters' chief war-designers and a central figure in the group.
  key_facts:
  - 阿戈尔人 / Aegirian
  - 深海猎人 / Abyssal Hunters
  - 斯卡蒂与幽灵鲨同伴 / Skadi and Specter are comrades
  - '歌蕾蒂娅 总战争设计师 / Gladiia: chief war-designer'
  traps:
  - 斯卡蒂、幽灵鲨是亲姐妹 / Skadi and Specter are biological sisters (off-canon)
  - 歌蕾蒂娅是斯卡蒂的下属 / Gladiia is Skadi's subordinate (swap — Gladiia is the senior figure)
  tags:
  - skadi
  - specter
  - gladiia
  - abyssal_hunters
  - aegir
  source: cn/operators/char_263_skadi.txt
  notes: Baked relations across char_263_skadi, char_1012_skadi2, char_1023_ghost2, char_474_glady.
- id: Q016
  category: relationship
  answer_type: open_ended
  difficulty: hard
  question_zh: 乌尔比安在深海猎人体系中扮演什么角色？特别是与斯卡蒂的关系？
  question_en: What role does Ulpianus play among the Abyssal Hunters, especially in relation to Skadi?
  gold_zh: 乌尔比安是深海猎人之一，并且是斯卡蒂战斗手段的导师——「斯卡蒂的那些手段都是这个叫乌尔比安的家伙教的」。但他本人自评在身体机能上比不上斯卡蒂和幽灵鲨。
