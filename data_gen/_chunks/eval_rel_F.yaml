  - 乌尔比安在身体机能上压制全体猎人 / Ulpianus physically dominates all hunters (false — he says the opposite)
  tags:
  - ulpianus
  - skadi
  - abyssal_hunters
  source: cn/operators/char_263_skadi.txt
  notes: Baked relations char_4145_ulpia mentor_of 斯卡蒂 with notes='教导战斗方式'.
