  - W 早已背叛特蕾西娅 / W has long betrayed Theresa (false — she remains loyal to Theresa's memory)
  tags:
  - w
  - theresa
  - sarkaz
  source: cn/operators/char_113_cqbw.txt
  notes: Baked relation subordinate_of, notes='殿下即特蕾西娅'.
