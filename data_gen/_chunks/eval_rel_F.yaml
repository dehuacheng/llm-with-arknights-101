- id: Q008
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: W 与赫德雷、伊内丝之间是什么关系？
  question_en: What is W's relationship with Hoederer and Ines?
  gold_zh: 三人是长期搭档/前雇佣兵同伴。W 在档案中提到日常即「做完饭之后伊内丝一定会要我去搭帐篷，接着赫德雷多半就要拉我去踩点了」；赫德雷的档案也明确他「曾以整合运动所属萨卡兹雇佣兵的身份与伊内丝、W 一起出现在切尔诺伯格」。
  gold_en: The three are long-term comrades and former mercenary teammates. W's own line — 'After cooking, Ines will always
    make me set up the tent, then Hoederer will pull me along to scout' — captures the routine; Hoederer's file confirms he
    'appeared at Chernobog alongside Ines and W as Reunion-affiliated Sarkaz mercenaries.'
  key_facts:
  - 长期队友 / long-term teammates
  - 前雇佣兵同伴 / former mercenary comrades
  - 切尔诺伯格 / Chernobog
  traps:
  - W 是赫德雷的下属 / W is Hoederer's subordinate (over-specifies — they are peers)
  - 三人是家人 / they are family (false — comrades, not kin)
  tags:
  - w
  - hoederer
  - ines
  - sarkaz
  - mercenaries
  source: cn/operators/char_113_cqbw.txt
  notes: Baked relations from W (char_113_cqbw), Hoederer (char_4088_hodrer), Ines (char_4087_ines).
