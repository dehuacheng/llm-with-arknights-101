  category: relationship
  answer_type: factoid
  difficulty: medium
  question_zh: 山（Mountain）的越狱事件与赫默有何关联？
  question_en: How is Mountain's prison-break tied to Silence (Warfarin)?
  gold_zh: 档案说山的「来历中和莱茵生命以及越狱有关的部分需要被保密」；赫默是越狱事件的共同参与者之一。
