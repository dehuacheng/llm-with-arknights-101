- id: Q001
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 凯尔希与阿米娅之间是怎样的关系？档案里是如何描述的？
  question_en: What is the relationship between Kal'tsit and Amiya, as described in the archive?
  gold_zh: 凯尔希是阿米娅的监护人/养母。巴别塔覆灭后的会议上，被问及阿米娅时凯尔希只说了一句「我会抚养她」；档案三里也将「监护人/养母」明确列为凯尔希对阿米娅的角色。
  gold_en: Kal'tsit is Amiya's guardian and de facto adoptive mother. In the post-Babel meeting Kal'tsit's only reply about
    Amiya is the single line 'I will raise her'; her archive explicitly labels the role as guardian/foster-mother.
  key_facts:
  - 监护人/养母 / guardian and foster-mother
  - 「我会抚养她」 / "I will raise her"
  - 巴别塔覆灭后 / after Babel fell
  traps:
  - 亲生母女 / biological mother and daughter (false — never stated in canon)
  - 上级与下属 / mere superior–subordinate (under-specifies the parental role)
  tags:
  - kalts
  - amiya
  - babel
  - rhodes_island
  source: cn/operators/char_003_kalts.txt
  notes: Baked relation type=family_of with notes='监护人/养母'; quote from kalts 档案资料三.
- id: Q002
  category: relationship
  answer_type: factoid
  difficulty: easy
  question_zh: Mon3tr 与凯尔希是什么关系？
  question_en: What is Mon3tr's relationship to Kal'tsit?
  gold_zh: Mon3tr 是凯尔希长期协同作战的伴生生物。凯尔希在语音中说「Mon3tr 和我会保护所有人的，特别是博士你」。
  gold_en: Mon3tr is Kal'tsit's long-time combat companion. In a voice line she says, 'Mon3tr and I will protect everyone
    — especially you, Doctor.'
  key_facts:
  - 伴生生物 / companion creature
  - 协同作战 / combat partner
  traps:
  - 独立干员 / independent operator (false — Mon3tr is a companion, not a roster operator)
  - 凯尔希的宠物 / pet (under-specifies — combat-grade companion, project-coded)
  tags:
  - kalts
  - mon3tr
  - ama-10
  source: cn/operators/char_003_kalts.txt
  notes: Baked relation type=ally_of, notes=伴生生物/协同作战.
- id: Q003
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 凯尔希与特蕾西娅曾经的关系是怎样的？
  question_en: What was the past relationship between Kal'tsit and Theresa?
  gold_zh: 两人是巴别塔时期的同伴与下属上级关系——凯尔希听从特蕾西娅的指示行事；同时特蕾西娅在晋升记录中对凯尔希说「但我一直是你的同伴。之后依然也是」，明确把凯尔希视为同伴。
  gold_en: They were Babel-era comrades, with Kal'tsit acting under Theresa's direction. Theresa's words in the promotion
    record — 'But I have always been your companion. I always will be' — frame Kal'tsit as a companion as well as a subordinate.
  key_facts:
  - 巴别塔同伴 / Babel-era comrades
  - 听从特蕾西娅的指示 / followed Theresa's direction
  - 「我一直是你的同伴」/ "I have always been your companion"
  traps:
  - 姐妹关系 / sisters (off-canon — they are not stated to be biological kin)
  - 敌对关系 / adversarial (false — they were comrades, not enemies)
  tags:
  - kalts
  - theresa
  - babel
  source: cn/operators/char_003_kalts.txt
  notes: Baked relations ally_of + subordinate_of (Theresa as tail); quotes from kalts 晋升记录 and 档案资料三.
- id: Q004
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 华法琳与凯尔希的关系如何？
  question_en: What is Warfarin's relationship to Kal'tsit?
  gold_zh: 华法琳与凯尔希共同建立了罗德岛的医疗体系基盘；她在职位上是凯尔希的下属，凯尔希甚至下令华法琳不得主动接近博士。
  gold_en: Warfarin co-founded Rhodes Island's medical system with Kal'tsit. She is a subordinate in standing — Kal'tsit at
    one point ordered Warfarin not to approach the Doctor on her own initiative.
  key_facts:
  - 共同建立罗德岛医疗体系 / co-founded Rhodes Island's medical system
  - 下属 / subordinate
  - 凯尔希曾下令限制其行动 / Kal'tsit issued an order restricting her approach to the Doctor
  traps:
  - 完全平等的合伙人 / equal co-leaders (over-specifies — Warfarin is a subordinate)
  - 敌对关系 / rivals (false — they cooperate)
  tags:
  - kalts
  - warfarin
  - rhodes_island
  - medical
  source: cn/operators/char_171_bldsk.txt
  notes: 'Baked relations from char_171_bldsk (Warfarin): ally_of + subordinate_of with tail=Kal''tsit.'
- id: Q005
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 德克萨斯与拉普兰德是怎样的关系？档案是怎么说的？
  question_en: How does the archive describe the relationship between Texas and Lappland?
  gold_zh: 两人是叙拉古的旧识与宿敌。干员拉普兰德对作为罗德岛行动协助人员的德克萨斯怀有密切的关注；德克萨斯本人也提到「我在叙拉古见过拉普兰德」，但对两人的胜负刻意回避。
  gold_en: They are old acquaintances and rivals from Siracusa. Lappland 'maintains a close watch' over Texas in her capacity
    at Rhodes Island; Texas confirms 'I met Lappland in Siracusa' but explicitly declines to discuss who won.
  key_facts:
  - 叙拉古旧识 / Siracusan acquaintances
  - 宿敌 / rivals
  - 「我在叙拉古见过拉普兰德」/ "I met Lappland in Siracusa"
  traps:
  - 姐妹 / sisters (false — same faction past, not kin)
  - 罗德岛新结识的朋友 / new friends met at Rhodes Island (wrong — the relationship predates RI)
  tags:
  - texas
  - lappland
  - siracusa
  - rivalry
  source: cn/operators/char_140_whitew.txt
  notes: Baked relation type=rival_of for both; quotes from Lappland 档案 and Texas alter (char_1028_texas2).
- id: Q006
  category: relationship
  answer_type: factoid
  difficulty: easy
  question_zh: 能天使在企鹅物流里担任什么角色？
  question_en: What role does Exusiai hold within Penguin Logistics?
  gold_zh: 能天使是企鹅物流的「核心」之一（虽然她加入时间较晚），并以信使/武装押运的身份活动；她兼任罗德岛驻派联络人员之一。
  gold_en: Exusiai is described as one of Penguin Logistics' 'core' members despite joining late, and she works as a messenger
    / armed-escort. She also serves as a Penguin Logistics liaison stationed at Rhodes Island.
  key_facts:
  - 企鹅物流核心成员 / core member of Penguin Logistics
  - 信使/武装押运 / messenger / armed escort
  traps:
  - 企鹅物流的领导者 / leader of Penguin Logistics (false — leadership is held by 老板; Exusiai is not the boss)
  - 罗德岛专职狙击 / Rhodes Island full-time sniper (incomplete — she is on loan via Penguin Logistics)
  tags:
  - exusiai
  - penguin_logistics
  - rhodes_island
  source: cn/operators/char_103_angel.txt
  notes: 'Baked: char_1041_angel2 ally_of texas notes=''她才是企鹅物流的核心''; char_103_angel identifies_as 信使.'
