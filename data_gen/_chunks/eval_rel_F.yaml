- id: Q022
  category: relationship
  answer_type: open_ended
  difficulty: hard
  question_zh: 年（Nian）在罗德岛中的角色，以及她与年家兄弟姐妹的关系？
  question_en: What is Nian's role at Rhodes Island, and how does she relate to her siblings?
  gold_zh: 年现「凭访客身份逗留于罗德岛」，偶尔为金属加工项目提供建议，与阿米娅是友好朋友关系但很少碰面。她是炎国「重岳」一脉的妹妹，「年、夕、令」三姐妹（重岳是她们的兄长）；与同辈黍、令、夕等也以兄弟姐妹相称。
  gold_en: 'Nian holds visitor status at Rhodes Island and occasionally advises its metalworking projects; she and Amiya are
    ''friendly but rarely meet.'' Within Yan she is a younger sister in the Chongyue family: Chongyue is the elder brother
    of the trio ''Nian, Dusk, Ling,'' and Shu, Yu, and Wang refer to her in matching sibling terms.'
  key_facts:
  - 罗德岛访客身份 / Rhodes Island visitor status
  - 金属加工项目顾问 / metalworking project advisor
  - 炎国巨兽兄妹 / Yan beast-clan siblings (Chongyue, Nian, Dusk, Ling, etc.)
  traps:
  - 年是罗德岛的全职干员 / Nian is a full-time Rhodes Island operator (over-specifies — visitor status only)
  - 年与重岳无任何亲缘关系 / Nian is unrelated to Chongyue (false — Chongyue is her elder brother)
  tags:
  - nian
  - yan
  - rhodes_island
  - siblings
  source: cn/operators/char_2014_nian.txt
  notes: Baked relations across char_2014_nian, char_2015_dusk, char_2023_ling, char_2024_chyue, char_2025_shu, char_2026_yu,
    char_2027_wang.
- id: Q023
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 泥岩与整合运动、与罗德岛的关系如何变化？
  question_en: How did Mudrock's affiliation evolve between Reunion and Rhodes Island?
  gold_zh: 泥岩曾是萨卡兹雇佣兵，随军加入整合运动，后因意见不合带领小队远离乌萨斯；最终经精英干员 Logos 接触，进入罗德岛，并以「我服从您的指挥」的态度接受指挥；登舰之初她对凯尔希医生的存在表示「虽然很吃惊，但是也能让人更安心」。
  gold_en: Mudrock was a Sarkaz mercenary who joined Reunion's march, then 'led her squad away from Ursus due to a disagreement.'
    She later made contact with elite operator Logos in Kazdel and reached Rhodes Island, accepting the chain of command ('I
    am only a Rhodes Island operator now, I obey your orders'); on first hearing Kal'tsit was at Rhodes Island she remarked
    'It's surprising, but it also makes one feel more at ease.'
  key_facts:
  - 前萨卡兹雇佣兵 / former Sarkaz mercenary
  - 随军加入整合运动后脱离 / joined Reunion, then split off
  - 经 Logos 进入罗德岛 / reached Rhodes Island via Logos
  traps:
  - 泥岩从未加入过整合运动 / Mudrock never joined Reunion (false — she did, then left)
  - 泥岩是 W 的下属 / Mudrock is W's subordinate (off-canon — they share a Sarkaz background but distinct paths)
  tags:
  - mudrock
  - reunion
  - rhodes_island
  - sarkaz
  source: cn/operators/char_311_mudrok.txt
  notes: 'Baked relations char_311_mudrok: member_of 整合运动 (脱离), member_of 罗德岛, ally_of Logos, subordinate_of 凯尔希.'
