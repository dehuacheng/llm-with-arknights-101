- id: Q027
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 塞雷娅在莱茵生命对斐尔迪南持什么态度？
  question_en: What stance does Saria take toward Ferdinand at Rhine Lab?
  gold_zh: 塞雷娅说自己「没有什么打算，他也不需要我来操心」；但若斐尔迪南想回莱茵的总辖办公桌，「他需要站上我的拳击台。当然，他可以穿上他的动力甲」——既不阻止也不放任，以个人较量为门槛。
  gold_en: 'Saria says she ''has no particular plan; he doesn''t need my attention,'' but adds that if Ferdinand wants to
    sit back down at his Rhine desk, ''he needs to stand on my boxing ring — and yes, he may wear his power suit.'' Neither
    rejection nor invitation: a personal-combat gate.'
  key_facts:
  - 「站上我的拳击台」 / "step onto my boxing ring"
  - 斐尔迪南需自行解决前科 / Ferdinand must clear his own slate
  - 塞雷娅不主动出手 / Saria takes no active steps
  traps:
  - 塞雷娅已开除斐尔迪南 / Saria has fired Ferdinand (false — she leaves the choice to him)
  - 塞雷娅是斐尔迪南的下属 / Saria is Ferdinand's subordinate (false — she succeeded Kristen as Director)
