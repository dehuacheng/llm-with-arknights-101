- id: Q015
  category: faction
  answer_type: open_ended
  difficulty: medium
  question_zh: 整合运动在主线第六章后的领导结构是怎样的？
  question_en: What is Reunion's leadership structure as of the end of main Episode 6?
  gold_zh: 整合运动表面上由塔露拉领导，但实质受到老一辈萨卡兹（如「Patriot」多伊瑟玛斯尼尔，以及一度居幕后的老一辈梅菲斯特、浮士德）的影响。第六章后浮士德战死、霜星阵亡，组织内部因梅菲斯特施展禁术「牧群」而进一步崩溃；塔露拉的权威进一步集中，整合运动从「多元的感染者抗争」逐步退化为更危险的极端力量。
  gold_en: On the surface Reunion is led by Talulah, but in practice it is shaped by older Sarkaz figures (notably Patriot
    / Daeumathnir and the earlier Mephisto and Faust). After Episode 6, Faust dies in combat, FrostNova falls, and Mephisto's
    forbidden 'Herd' transformation collapses the organisation from within. Talulah's authority becomes more concentrated,
    and Reunion drifts from a pluralistic Infected resistance into a more dangerous extremist force.
  key_facts:
  - 塔露拉 / Talulah
  - Patriot / 多伊瑟玛斯尼尔 / Daeumathnir
  - 梅菲斯特 / Mephisto
  - 浮士德 / Faust
  traps:
  - 整合运动从一开始就由塔露拉独裁 / Reunion was Talulah's dictatorship from the start (oversimplifies — old Sarkaz steered her)
  - Patriot公开领导整合运动 / Patriot publicly leads Reunion (he is influential but not the public face)
  tags:
  - reunion
  - talulah
  - patriot
  - mephisto
  - faust
  source: cn/stories/main_06.txt
  notes: ''
- id: Q016
  category: faction
  answer_type: factoid
  difficulty: medium
  question_zh: 卡西米尔的「商业联合会」与「监正会」是什么关系？
  question_en: What is the relationship between Kazimierz's Major Commercial Alliance and the Major Inquisition?
  gold_zh: 二者是卡西米尔大骑士领并立的两大权力机构：商业联合会主导商业与娱乐（包括特锦赛与各骑士团的商业化），监正会则代表传统骑士秩序与法度。两者长期博弈；在「长夜临光」期间，商业联合会暗中支持无胄盟清洗感染者，而监正会一度协同罗德岛和临光家族出手平衡局势。
  gold_en: They are the twin power centres of the Kazimierz Great Knightly Territories. The Major Commercial Alliance controls
    commerce and entertainment (including the Major Tournament and the commercialised knightly orders); the Major Inquisition
    embodies the traditional knightly order and law. The two are in chronic tension. During Near Light, the Commercial Alliance
    covertly backs the Armorless Union's purges of the Infected, while the Major Inquisition ends up tacitly coordinating
    with Rhodes Island and the Nearl family to rebalance the situation.
  key_facts:
  - 商业联合会 / Major Commercial Alliance
  - 监正会 / Major Inquisition
  - 无胄盟 / Armorless Union
  - 卡西米尔 / Kazimierz
  traps:
  - 二者本质是同一机构的两个部门 / they are two departments of the same agency (false — distinct power centres)
  - 监正会公开支持无胄盟 / the Major Inquisition openly supports the Armorless Union (false — covert support comes from the Alliance)
