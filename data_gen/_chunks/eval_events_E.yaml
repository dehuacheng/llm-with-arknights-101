  - 公证所只在拉特兰境内活动 / Notarial Hall operates only inside Laterano (false — messengers travel across Terra)
  tags:
  - laterano
  - notarial_hall
  - messenger
  - exusiai
  source: cn/operators/char_103_angel.txt
  notes: Exusiai's archive references Laterano custom of messengers carrying weapons in ceremonial settings.
