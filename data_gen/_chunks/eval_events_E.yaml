  question_zh: 古巴别塔（Babel）的历史定位是什么？
  question_en: What is the historical role of Babel?
  gold_zh: 古巴别塔是萨卡兹历史上由特蕾西娅倡导建立的多种族共同体组织，旨在通过和平与共同治理终结萨卡兹的战争循环；其崩塌也是当代罗德岛部分核心成员（如凯尔希）所背负的历史包袱之一。
  gold_en: Babel was a multi-racial community organisation in Sarkaz history championed by Theresa, aimed at ending the Sarkaz
    cycle of war through peace and joint governance. Its collapse is one of the historical burdens carried by certain core
    Rhodes Island members today (notably Kal'tsit).
  key_facts:
