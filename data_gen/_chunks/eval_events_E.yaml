  gold_zh: 陈的主体身份是龙门近卫局特别督察组组长，她以契约方式协助罗德岛任务。一方面她忠于龙门的执法体系；另一方面她在主线第六章对龙门「黑蓑」清理贫民区的手段产生了强烈质疑，但仍选择留在体制内承担责任，而非放弃龙门加入罗德岛。
  gold_en: Ch'en's primary identity is Special Inspection Chief of the Lungmen Guard Department. She assists Rhodes Island
    under contract. On one hand she is loyal to Lungmen's law-enforcement system; on the other, in Episode 6 she strongly
