- id: Q005
  category: event
  answer_type: open_ended
  difficulty: medium
  question_zh: 第六章「局部坏死」中霜星的结局是什么？
  question_en: What is FrostNova's fate at the end of Episode 6 "Partial Necrosis"?
  gold_zh: 霜星率雪怪小队与罗德岛在切尔诺伯格废墟遭遇。一次塌陷事故让双方短暂休战合作；之后雪怪小队在阻击战中全军覆没。心如死灰的霜星仍坚持以战士的职责与罗德岛展开决战，最终透支生命力后力竭逝世，临终前将其理想托付给罗德岛，正式表达了加入意愿。
  gold_en: FrostNova leads the FrostNova Squad against Rhodes Island in the Chernobog ruins. A cave-in forces a brief truce
    while they cooperate, but the squad is wiped out in the holding action. Numb with grief, FrostNova still insists on a
    warrior's duty and fights Rhodes Island to the death. She burns through her vitality and dies of exhaustion, but in her
    last moments entrusts her ideals to Rhodes Island and formally expresses her wish to join.
  key_facts:
  - 霜星阵亡 / FrostNova dies
  - 切尔诺伯格废墟 / Chernobog ruins
  - 雪怪小队覆灭 / FrostNova Squad annihilated
  - 托付理想 / entrusts her ideals
  traps:
  - She is captured and treated by Rhodes Island (false — she dies)
  - She defects mid-battle and survives (false — only her ideals survive)
  tags:
  - main_06
  - frostnova
  - chernobog
  - death
  - reunion
  source: cn/stories/main_06.txt
  notes: ''
- id: Q006
  category: event
  answer_type: factoid
  difficulty: medium
  question_zh: 在第九章「风暴瞭望」中，干员 Outcast 是在什么情境下牺牲的？
  question_en: Under what circumstances does the operator Outcast sacrifice herself in Episode 9 "Stormwatch"?
  gold_zh: 维多利亚驻军上校汉密尔顿在小丘郡动用活性源石脏弹炮击城区。Outcast 在救援期间意外救下重伤的深池「领袖」之影拉芙希妮；为掩护风笛护送伤员撤离，她以个人名义独自断后，在释放神圣光芒后与多名深池骨干同归于尽。
  gold_en: Colonel Hamilton of the Victorian garrison uses live-originium dirty shells on the town of Tara's Hill. During
    the rescue, Outcast unexpectedly saves the wounded shadow of the Dublinn 'Leader' Lavinia/Lafarsina. To cover Bagpipe's
    retreat with the wounded, she stays behind alone and, after releasing a holy radiance, dies alongside several Dublinn
    cadres.
  key_facts:
  - Outcast
  - 小丘郡 / Tara's Hill
  - 断后 / rearguard
  - 深池 / Dublinn
  traps:
  - She dies fighting Hamilton himself (wrong opponent)
  - She is killed by Horn (wrong subject; Horn fights to cover Bagpipe but does not kill Outcast)
  tags:
  - main_09
  - outcast
  - tarashill
  - dublinn
  - victoria
  source: cn/stories/main_09.txt
  notes: ''
- id: Q007
  category: event
  answer_type: open_ended
  difficulty: hard
  question_zh: 请描述第十二章「惊霆无声」中诺伯特区脱离主城的事件。
  question_en: Describe the secession of Norport from the main city in Episode 12 "惊霆无声."
  gold_zh: 萨卡兹军事委员会通过飞空艇突袭摧毁了维多利亚海军，并将伦蒂尼姆的诺伯特区强制脱离主城，作为战略支点。脱离后区内秩序崩坏，萨卡兹的高压统治与物资匮乏引发严重内乱；推进之王维娜率格拉斯哥帮重回旧据点试图营救与安置难民，其维多利亚王储身份也在此过程中被公开。
  gold_en: 'The Sarkaz Military Commission uses airships to wipe out the Victorian navy and forcibly secedes Lundinium''s
    Norport district from the main city to serve as a strategic foothold. Order collapses inside the secession zone: Sarkaz
    oppression and supply shortages trigger severe internal unrest. Ascalon/Penance — Penance the Crown Prince — Crown Slayer
    aka Penance leads the Glasgow Gang back to their old turf to evacuate civilians; in the process her status as Victoria''s
    crown heir becomes public knowledge.'
  key_facts:
  - 诺伯特区 / Norport
  - 萨卡兹军事委员会 / Sarkaz Military Commission
  - 推进之王 / Penance / the Crown Prince
  - 维多利亚王储身份公开 / heir to Victoria revealed
  traps:
  - 诺伯特区是被罗德岛主动放弃 / Rhodes Island deliberately abandons Norport (false — Sarkaz force the secession)
  - 维多利亚海军反攻夺回主城 / the Victorian navy counter-attacks and retakes the city (false — the navy is destroyed)
  tags:
  - main_12
  - lundinium
  - norport
  - sarkaz
  - penance
  source: cn/stories/main_12.txt
  notes: 推进之王 here is 维娜 / Penance the heir, NOT Patriot. Easy confusion.
