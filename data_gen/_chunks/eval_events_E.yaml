  question_zh: 在「长夜临光」（act13side）中，玛嘉烈夺冠后所对抗的最大势力是哪一方？
  question_en: In "Near Light" (act13side), which faction does Margaret confront most directly after the tournament?
  gold_zh: 卡西米尔商业联合会授意的无胄盟。它们清洗感染者并暗中打压玛嘉烈；红松骑士团与临光家族、罗德岛等多方联合，最终挫败了无胄盟在决赛中的暗杀行动。
  gold_en: The Armorless Union, acting under Kazimierz's Major Commercial Alliance. They clean out infected residents and
