- id: Q009
  category: event
  answer_type: open_ended
  difficulty: medium
  question_zh: 请简述「喧闹法则」（act5d0）一活动的核心剧情。
  question_en: Summarize the core storyline of the activity "Code of Brawl" (act5d0).
  gold_zh: 拜松作为临时成员加入企鹅物流，随即遭遇叙拉古黑手党甘比诺与卡彭的袭击。鼠王亲自介入，借龙门安魂夜派对设下覆盖全城的「爆炸危机」考验。最终众人发现致命炸弹其实只是糖果礼盒——整场危机实为拜松之父委托鼠王为磨练拜松、并借机驱逐外来黑帮而设的局。
  gold_en: Bison joins Penguin Logistics as a temporary member and immediately runs into the Siracusan mafiosi Gambino and
    Capone. The Rat King personally intervenes, using the Lungmen All-Souls Night party to stage a city-wide 'bomb crisis.'
    In the end the lethal bombs turn out to be candy boxes — the whole crisis was set up by Bison's father, who commissioned
    the Rat King to both temper his son and drive out the foreign mafia.
  key_facts:
  - 拜松 / Bison
  - 企鹅物流 / Penguin Logistics
  - 鼠王 / Rat King
  - 甘比诺与卡彭 / Gambino and Capone
  - 考验 / a test
  traps:
  - 拜松最终接管了一个黑帮家族 / Bison takes over a mafia family (false — he sets out on a journey)
  - 鼠王是真心想毁灭龙门 / Rat King genuinely wants to destroy Lungmen (false — the bombs are candy)
  tags:
  - act5d0
  - bison
  - penguin_logistics
  - rat_king
  - siracusa
  source: cn/stories/act5d0.txt
  notes: ''
