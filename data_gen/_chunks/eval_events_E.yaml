- id: Q001
  category: event
  answer_type: factoid
  difficulty: medium
  question_zh: 在第一章「黑暗时代·下」中，是谁挺身断后阻击塔露拉、为罗德岛突围争取时间？
  question_en: In Episode 1 "Twilight of Dark Times," who stays behind to hold off Talulah and buy Rhodes Island time to retreat?
  gold_zh: 罗德岛的精英干员 Ace 带领小队独自断后，阻击「天灾化身」般的塔露拉，掩护博士与阿米娅等人撤出切尔诺伯格。
  gold_en: Ace, a Rhodes Island elite operator, leads a small team to stay behind and intercept Talulah—described as a catastrophe-vessel—buying
    time for the Doctor, Amiya, and the others to escape Chernobog.
  key_facts:
  - Ace / 阿
  - 断后 / rearguard
  - 塔露拉 / Talulah
  traps:
  - 杜宾 / Dobermann (covers the Doctor, but does not personally intercept Talulah)
  - W (ambushes them at the exit, but is not the rearguard against Talulah)
  tags:
  - main_01
  - chernobog
  - ace
  - talulah
  - rearguard
  source: cn/stories/main_01.txt
  notes: ''
- id: Q002
  category: event
  answer_type: open_ended
  difficulty: medium
  question_zh: 请简述第二章「异卵同生」的故事走向。
  question_en: Summarize the storyline of Episode 2 "Operation Originium / 异卵同生."
  gold_zh: 切尔诺伯格事变后，罗德岛与龙门统领魏彦吾合作，协助近卫局对抗整合运动渗透。双方目标是寻找掌握关键机密的乌萨斯少女米莎。阿米娅在企鹅物流协助下从龙门贫民窟救出米莎，但在向陈长官移交时遭遇 W 率部伏击，米莎被整合运动头目碎骨强行带走，任务陷入僵局。
  gold_en: After Chernobog, Rhodes Island enters a cooperation agreement with Lungmen's Wei Yenwu to help the Lungmen Guard
    Department resist Reunion infiltration. The objective is the Ursus girl Misha, who holds critical intelligence. Amiya,
    aided by Penguin Logistics, retrieves Misha from the Lungmen slums, but during the handover to Ch'en, an ambush led by
    W lets the Reunion cadre Crownslayer/Skullshatterer's allies — specifically Skullshatterer — abduct Misha, leaving the
    mission stalled.
  key_facts:
  - 魏彦吾 / Wei Yenwu
  - 米莎 / Misha
  - 碎骨 / Skullshatterer
  - 企鹅物流 / Penguin Logistics
  traps:
  - 塔露拉亲自出手抓走米莎 / Talulah personally abducts Misha (false — she is in command but not at the scene)
  - 弑君者率队伏击 / Crownslayer leads the ambush (W leads it; Crownslayer is mentioned elsewhere)
  tags:
  - main_02
  - lungmen
  - misha
  - wei_yenwu
  - skullshatterer
  source: cn/stories/main_02.txt
  notes: ''
- id: Q003
  category: event
  answer_type: factoid
  difficulty: hard
  question_zh: 在第三章「二次呼吸」中，米莎为什么会披上「碎骨」的装甲？
  question_en: In Episode 3 "Second Breath," why does Misha don the Skullshatterer armor?
  gold_zh: 米莎在整合运动据点与失散多年、已成为整合运动干部「碎骨」的弟弟重逢。弟弟为暗杀博士被阿米娅被迫释放力量击杀。目睹弟弟之死的米莎崩溃，在 W 的引导下决定继承弟弟的遗志，自己披上装甲成为第二任「碎骨」。
  gold_en: Misha reunites at a Reunion stronghold with her long-lost brother — now the Reunion cadre called Skullshatterer.
    When he attempts to assassinate the Doctor, Amiya is forced to unleash her power and kill him. Witnessing her brother's
    death breaks Misha; guided by W, she vows to inherit his will, dons his armor, and becomes the second Skullshatterer.
  key_facts:
  - 米莎 / Misha
  - 碎骨 / Skullshatterer
  - 弟弟阵亡 / brother killed
  - W
  traps:
  - She is forcibly converted by Mephisto (off-canon — Mephisto is not the catalyst here)
  - She inherits the armor from Crownslayer (wrong cadre)
  tags:
  - main_03
  - misha
  - skullshatterer
  - w
  - succession
  source: cn/stories/main_03.txt
  notes: ''
