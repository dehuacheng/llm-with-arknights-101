  question_zh: 罗德岛与企鹅物流的合作关系是怎样的？
  question_en: What is the cooperation relationship between Rhodes Island and Penguin Logistics?
  gold_zh: 罗德岛与企鹅物流是长期合作伙伴：企鹅物流以物流与外勤业务为主营，对罗德岛长期外派人手（特别是德克萨斯、能天使、可颂等核心员工），双方在多场龙门危机与跨国行动中并肩作战；这是「商业关系 + 半固定外派」混合的关系，双方仍各自独立。
  gold_en: Rhodes Island and Penguin Logistics are long-running partners. Penguin Logistics' main business is logistics and
    field work, and it routinely seconds personnel (especially Texas, Exusiai, Croissant) to Rhodes Island. The two sides
    have fought together through several Lungmen crises and cross-border operations. The relationship is a hybrid of 'commercial
    contract + semi-permanent secondment' — they remain independent organisations.
  key_facts:
  - 企鹅物流 / Penguin Logistics
  - 外派 / secondment
  - 德克萨斯 / Texas
  - 能天使 / Exusiai
  - 可颂 / Croissant
