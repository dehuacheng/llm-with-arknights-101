- id: "Q021"
  category: "event"
  answer_type: "open_ended"
  difficulty: "medium"
  question_zh: "阿米娅「升变档案二」里的萨卡兹锅炉工讲了什么样的特蕾西娅故事？"
  question_en: "What does the Sarkaz boiler worker in Amiya's Promotion Archive II tell about Theresa?"
  gold_zh: "他说在特蕾西娅之前的魔王名为以勒什。特蕾西娅与「将军」是宫廷里的混血兄妹（御前衣匠与持剑护卫）。以勒什战死后两人率领萨卡兹反击；战后特蕾西娅成为魔王，用近两百年试图为卡兹戴尔疗伤。"
  gold_en: "He recounts that the previous Demon Lord was Ealasid. Theresa and 'the General' were a mixed-blood brother-and-sister at Ealasid's court — royal seamstress and sword-bearer. After Ealasid fell in battle they led the counter-attack; Theresa later became Demon Lord and spent over two centuries trying to heal Kazdel."
  key_facts:
    - "以勒什 / Ealasid (previous Demon Lord)"
    - "将军与殿下是混血兄妹 / General and Theresa are mixed-blood siblings"
    - "御前衣匠 / royal seamstress"
    - "持剑护卫 / sword-bearer"
    - "两百多年 / over two hundred years"
  traps:
    - "由 Logos 讲述 / narrated by Logos (false — that is Promotion I)"
    - "特蕾西娅与将军是夫妻 / Theresa and the General are spouses (off-canon)"
  tags: ["amiya", "theresa", "general", "kazdel", "ealasid"]
  source: "cn/operators/char_002_amiya.txt"
  notes: ""

