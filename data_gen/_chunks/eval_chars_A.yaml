- id: "Q017"
  category: "event"
  answer_type: "open_ended"
  difficulty: "medium"
  question_zh: "巴别塔是谁建立的？它最终如何演变成罗德岛？"
  question_en: "Who founded Babel, and how did it become Rhodes Island?"
  gold_zh: "巴别塔由卡兹戴尔的萨卡兹魔王特蕾西娅与凯尔希共同建立。特蕾西娅死后巴别塔倒塌；凯尔希在会议上提出以「医治矿石病」作为新议题，并表示要抚养阿米娅，残部最终改组为罗德岛。"
  gold_en: "Babel was co-founded by Theresa — Demon Lord of Kazdel — and Kal'tsit. After Theresa's death Babel fell; in the post-collapse meeting Kal'tsit set 'treating Oripathy' as the new mission and committed to raising Amiya. The survivors reorganized as Rhodes Island."
  key_facts:
    - "特蕾西娅 / Theresa"
    - "凯尔希 / Kal'tsit"
    - "巴别塔覆灭后 / after Babel fell"
    - "矿石病新议题 / new mission: treat Oripathy"
    - "改组为罗德岛 / reorganized as Rhodes Island"
  traps:
    - "由特雷西斯创建 / founded by Theresis (Theresa's brother, false)"
    - "莱塔尼亚的研究小组 / a Leithanien research group (false)"
  tags: ["babel", "kalts", "theresa", "rhodes_island"]
  source: "cn/operators/char_003_kalts.txt"
  notes: "Sourced from Kal'tsit Archive File III; Amiya's Promotion Archive II is a parallel reference."

