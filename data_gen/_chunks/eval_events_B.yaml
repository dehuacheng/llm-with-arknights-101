  gold_zh: "塔露拉脱离科西切控制后在乌萨斯荒野救助感染者并结识挚友阿丽娜，随后与爱国者、霜星合流组建整合运动。但阿丽娜惨死、目睹民众的「平庸之恶」让她绝望，触发了科西切种下的「不死的黑蛇」诅咒，意识被其篡夺，整合运动也由此沦为阴谋家的棋子。"
  gold_en: "Free of Kaschey, Talulah rescued Infected in the Ursus wastes and met her close friend Alina, then joined the Patriot and FrostNova to found Reunion. Alina's death and the \"banality of evil\" she witnessed drove her to despair — triggering Kaschey's pre-planted \"Undying Black Serpent\" curse, which hijacked her consciousness and turned Reunion into a pawn of his schemes."
