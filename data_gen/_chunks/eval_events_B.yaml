  answer_type: "open_ended"
  difficulty: "medium"
  question_zh: "维多利亚的「自救军」是什么？他们和罗德岛是什么关系？"
  question_en: "What is Victoria's \"Self-Salvation Army,\" and how do they relate to Rhodes Island?"
  gold_zh: "自救军是维多利亚本地的反抗组织，主要在被萨卡兹占领的伦蒂尼姆地下活动；他们在主线第十、十一章里与罗德岛合作，共同瓦解萨卡兹军事委员会的武器威胁、营救民众。阿勒黛、费斯特、信使海蒂等人都是自救军成员。"
  gold_en: "The Self-Salvation Army is a Victorian resistance group, operating largely from the underground of Sarkaz-occupied Londinium. They partner with Rhodes Island across Episodes 10 and 11 to undermine the Sarkaz Military Committee's weapons threat and rescue civilians. Aletta, Fester and the courier Heidi are among its members."
  key_facts:
    - "自救军 / Self-Salvation Army"
    - "维多利亚 / Victoria"
    - "伦蒂尼姆 / Londinium"
    - "阿勒黛 / Aletta"
    - "萨卡兹军事委员会 / Sarkaz Military Committee"
  traps:
    - "自救军是萨卡兹的附属部队 / the Self-Salvation Army is a Sarkaz auxiliary (canon swap)"
    - "自救军隶属维多利亚王室直属 / it is a Victorian crown unit (off-canon)"
