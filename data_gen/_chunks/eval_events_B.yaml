  difficulty: "medium"
  question_zh: "龙门近卫局（L.G.D.）在切尔诺伯格事件中扮演了什么角色？"
  question_en: "What role does the L.G.D. play across the Chernobog incident?"
  gold_zh: "龙门近卫局是龙门的法律执行与城防机关。在第五章「靶向药物」中它联合罗德岛反击整合运动并夺回总部；在第八章「怒号光明」结尾，整合运动头目塔露拉就是被近卫局收监的。整个切尔诺伯格事件中，近卫局是龙门方面的主要执行单位。"
  gold_en: "The L.G.D. is Lungmen's law-enforcement and city-defence body. In Episode 5 it partners with Rhodes Island to push back Reunion and retake its HQ; at the end of Episode 8 it is the L.G.D. that takes Talulah into custody. Across the entire Chernobog arc, the L.G.D. is Lungmen's lead operational force."
  key_facts:
    - "龙门近卫局 / L.G.D."
    - "陈 / Ch'en"
    - "夺回总部 / retakes HQ"
    - "收监塔露拉 / imprisons Talulah"
  traps:
    - "近卫局只是民事部门，没有参与战斗 / the L.G.D. is purely civil and does not fight (false)"
    - "近卫局由企鹅物流代行职能 / Penguin Logistics fulfils the L.G.D.'s combat role (off-canon)"
  tags: ["lgd", "lungmen", "chernobog"]
