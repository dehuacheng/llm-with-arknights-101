  notes: ''
- id: Q012
  category: character
  answer_type: factoid
  difficulty: hard
  question_zh: 档案中如何描述玛恩纳父亲西里尔与母亲约兰塔的早年事迹？
  question_en: How does Mlynar's archive describe his parents Cyril and Yolanta Nearl?
  gold_zh: 档案资料三记载：约二十五年前的征战骑士对乌萨斯突袭中，斯尼茨与约兰塔在同一骑士团旗下崭露头角；斯尼茨甚至在关键战役中临时接过重伤骑士团长的指挥权。约兰塔出身于古老的骑士家族，原本预定进入银枪天马骑士团，但斯尼茨坚持她更适合弯弓而非银枪——这判断在她第一次拉弓时就已得出。
  gold_en: 'Archive File III: about 25 years ago, during the Crusader Knights'' surprise attack on Ursus, Cyril (Sniezh) and
    Yolanta first distinguished themselves under the same knight order; Cyril even temporarily took command of the order after
    its leader was critically wounded. Yolanta came from an old knightly family and had been slated to join the Silver Pegasus
    order, but Cyril insisted the bow suited her better than the silver spear — a judgment he made the first time she drew
    a bowstring.'
  key_facts:
  - 二十五年前征战骑士对乌萨斯突袭 / Crusader Knights' surprise attack on Ursus ~25 years ago
  - 斯尼茨临时接过指挥权 / Cyril took temporary command
  - 约兰塔更适合弓 / Yolanta suited to the bow
  traps:
  - 在莱塔尼亚战场 / on a Leithanien battlefield (off-canon)
  - 约兰塔最终加入银枪天马 / Yolanta did join Silver Pegasus (no — Cyril redirected her)
  tags:
  - mlynar
  - nearl
  - kazimierz
  - history
  source: cn/operators/char_4064_mlynar.txt
  notes: Archive File III,权限记录.
