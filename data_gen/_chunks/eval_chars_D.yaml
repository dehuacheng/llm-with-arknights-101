- id: Q002
  category: character
  answer_type: open_ended
  difficulty: medium
  question_zh: 为什么斯卡蒂在罗德岛干员之间不太受欢迎？
  question_en: Why is Skadi unpopular among most Rhodes Island operators?
  gold_zh: 档案资料一指出几点：她离群索居、少言寡语，主动避开社交邀请；战场上很少与队友配合，常独自解决任务让队友收拾残局；回绝他人时冷言冷语，战场形象残酷。这些综合起来让不少干员对她不满，甚至流传起被妖魔化的传闻。
  gold_en: 'Her Archive File I cites several factors: she is reclusive and quiet, actively avoids social invitations, rarely
    coordinates with teammates in battle (often soloing missions and leaving others to mop up), and is curt when refusing
    people. Combined with her brutal combat image, this bred dissatisfaction and even semi-mythologised rumors about her on
    the ship.'
  key_facts:
  - 离群索居 / reclusive
  - 不与队友配合 / does not coordinate with teammates
  - 战场形象残酷 / brutal combat image
  traps:
  - 因为她是萨卡兹 / because she is Sarkaz (her race is undisclosed)
  - 因为她长期与凯尔希对立 / because she clashes with Kal'tsit (off-canon)
  tags:
  - skadi
  - personality
  - rhodes_island
  source: cn/operators/char_263_skadi.txt
  notes: ''
