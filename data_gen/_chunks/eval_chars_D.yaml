- id: Q031
  category: character
  answer_type: factoid
  difficulty: medium
  question_zh: 艾雅法拉的矿石病在生理上有什么明显症状？
  question_en: What physical symptom of Oripathy is most prominent in Eyjafjalla?
  gold_zh: 档案资料三说明：她的听觉神经系统受矿石病压迫严重，伴发不同程度的听觉失灵；日常交流必须借助助听工具或多次重复对话。她在症状进一步恶化前已由罗德岛介入治疗，目前病情发展趋于缓慢。
  gold_en: 'Archive File III: Oripathy is severely compressing her auditory nerves, causing varying degrees of hearing loss.
    She must use a hearing aid or rely on repeated phrasing for everyday conversation. Rhodes Island intervened before symptoms
    worsened further, and progression is now slow.'
  key_facts:
  - 听觉神经系统受压迫 / auditory nerve system compressed
  - 听觉失灵 / hearing loss
  - 助听工具 / hearing aid
  traps:
  - 视觉问题 / vision problems (false — it's hearing)
  - 行动能力丧失 / loss of mobility (false)
  tags:
  - eyjafjalla
  - oripathy
  - hearing
  source: cn/operators/char_180_amgoat.txt
  notes: ''
- id: Q032
  category: character
  answer_type: factoid
  difficulty: hard
  question_zh: 艾雅法拉的「小黑羊」是什么？档案里提到了什么异常现象？
  question_en: What are Eyjafjalla's 'little black sheep', and what unusual behaviour does her archive describe?
  gold_zh: 晋升记录记载：「小黑羊」是艾雅法拉母亲生前送给她的宠物，平日温顺迟缓，主要爱好是在艾雅法拉房间或宽敞处睡觉，可以帮她搬运书本货物。权限记录指出，它们体型其实并不小，行踪却很神秘；当它们生气或高兴时会产生极热的温度，随意触摸甚至可能烫伤——机制尚需研究。
  gold_en: 'Promotion record: the ''little black sheep'' were given to Eyjafjalla as pets by her late mother; normally gentle
    and slow, they like to nap in her room or open spaces and can ferry books and packages for her. A restricted note adds
    that despite being called ''little'' they are actually large, their whereabouts are mysterious, and when angry or happy
    they radiate intense heat — a touch can scald you. The mechanism is still under study.'
  key_facts:
  - 母亲所赠 / gift from her mother
  - 可以搬运书本 / can carry books
  - 情绪激动时产生极热 / radiates intense heat when emotional
  traps:
  - 由凯尔希实验培育 / engineered by Kal'tsit (off-canon)
  - 为普通宠物羊 / ordinary pet goats (false — they radiate heat)
  tags:
  - eyjafjalla
  - pets
  - leithanien
  - promotion
  source: cn/operators/char_180_amgoat.txt
  notes: Promotion record / 晋升记录, includes 权限记录 sub-section.
