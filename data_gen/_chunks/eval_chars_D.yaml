- id: Q022
  category: character
  answer_type: open_ended
  difficulty: medium
  question_zh: 星熊为何能破格加入龙门近卫局？是谁交涉的？
  question_en: How did Hoshiguma exceptionally join the Lungmen Guard, and who arranged it?
  gold_zh: 客观履历指出：星熊存在数项指控记录；经龙门总督魏彦吾交涉，近卫局凭借她的优异能力与良好表现，破格将其吸纳进近卫局特别督察组。她在处理高危险性犯罪事件、要员保护与灾害紧急救援等领域表现出较高专业性。
  gold_en: Her objective record notes she has several indictments on file. Lungmen Governor Wei Yenwu personally negotiated
    her exceptional admission to the Guard, citing her ability and conduct; she was placed in the Special Inspections team
    and excels at high-risk crime response, VIP protection and disaster relief.
