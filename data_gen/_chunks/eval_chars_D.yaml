  question_zh: 玛恩纳为何加入罗德岛？是在什么事件之后？
  question_en: Why did Mlynar join Rhodes Island, and after what event?
  gold_zh: 档案资料四记载，他在「茨沃涅克附近地区的感染者暴动事件」之后接受合作邀请加入罗德岛。在被人事部追问加入动机时他给出突兀的回答：「我只是一直在想，我必须证明卡西米尔仍然有路可走。」客观履历也注明是在特锦赛后约两个月接受邀请。
  gold_en: 'Archive File IV records he joined after ''the Infected uprising in the area near Cwiernik'', responding to HR''s
    later prompt with the abrupt line: ''I just kept thinking — I must prove that Kazimierz still has a path forward.'' His
    objective record dates the cooperation agreement to about two months after the Major.'
  key_facts:
  - 茨沃涅克感染者暴动 / Cwiernik Infected uprising
  - 特锦赛后约两个月 / about two months after the Major
  - 证明卡西米尔仍有路可走 / prove Kazimierz still has a path
