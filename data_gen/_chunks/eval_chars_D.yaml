  notes: ''
- id: Q024
  category: character
  answer_type: factoid
  difficulty: hard
  question_zh: 魏彦吾在星熊晋升记录中留给博士的提示是什么？
  question_en: What hint does Wei Yenwu leave the Doctor in Hoshiguma's promotion record?
  gold_zh: 晋升记录中魏彦吾说：「这个人，星熊，我可以借给你们。」并提示「若你以为她是个理智的人，那说明你还没有完全了解她。」他还指出，那面盾名为「般若」——等到星熊愿意亲自告诉博士那面盾的来历时，博士才算真正了解她。
  gold_en: 'In her promotion record, Wei Yenwu tells the Doctor: ''This person, Hoshiguma, I can lend to you.'' He warns:
    ''If you think she is a rational person, then you don''t truly know her yet.'' He names her shield ''Hannya'' and says
    only when she herself tells the Doctor where it came from will he truly know her.'
  key_facts:
  - 魏彦吾 / Wei Yenwu
  - 般若（盾名）/ Hannya (shield's name)
  - 盾的来历是了解她的关键 / knowing the shield's origin is the key to knowing her
  traps:
  - 盾名「青龙」 / shield named 'Azure Dragon' (off-canon)
  - 魏彦吾说她是理智之人 / Wei calls her rational (the OPPOSITE — he warns she isn't)
  tags:
  - hoshiguma
  - wei_yenwu
  - hannya
  - promotion
  source: cn/operators/char_136_hsguma.txt
  notes: Promotion record / 晋升记录.
