  gold_zh: 档案资料三说明，她的记忆认知障碍并非普通的记忆缺失，而是「一段时间的多重记忆混乱」——脑中存有大量不同记忆，其中的她拥有完全不同的人际关系、身处不同的地理位置。调查难度极高，难以辨别真伪。
  gold_en: 'Archive File III says her condition is not ordinary memory loss but ''multi-memory confusion over a stretch of
