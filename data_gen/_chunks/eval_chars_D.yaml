- id: Q026
  category: character
  answer_type: open_ended
  difficulty: medium
  question_zh: 塞雷娅的源石技艺有何独到之处？
  question_en: What is distinctive about Saria's Originium Arts?
  gold_zh: 档案资料一记载：除常规源石技艺外，塞雷娅能自由操作以自身为圆心、一定区域内的钙元素及其化合物。结合医学知识，可用于阻挡敌人、削弱敌人、武装自身或配合队友——「源石技艺的强大不在于它的运作方式，而在于它所能达到的目的」。
  gold_en: 'Archive File I: beyond ordinary Arts, Saria can freely manipulate calcium and calcium compounds within a region
    centred on herself. Combined with her medical knowledge, she can block enemies, weaken them, armour herself, or support
    teammates: ''the power of Arts lies not in how it works but in what end it serves.'''
  key_facts:
  - 操作钙元素及其化合物 / manipulates calcium and its compounds
  - 自身为圆心 / centred on herself
  - 结合医学知识 / combined with medical knowledge
  traps:
  - 火焰系源石技艺 / fire-based Arts (false)
  - 可以操作所有金属 / manipulates all metals (false — calcium specifically)
  tags:
