- id: Q023
  category: relationship
  answer_type: factoid
  difficulty: medium
  question_zh: 档案中如何描述星熊与陈在近卫局的关系？
  question_en: How does the archive describe Hoshiguma's working relationship with Ch'en at the Guard?
  gold_zh: 档案资料二指出：在职位上陈长官是星熊的上司，但根据履历，星熊加入近卫局的时间还要在陈长官之前，并且两人共事很久——因此相互之间完全没有上下级应有的疏离感。星熊在龙门的方方面面（黑道、白道、政治、经济、教育、外交）的了解远胜陈长官。
  gold_en: 'Archive File II: by rank Ch''en is her superior, but Hoshiguma actually joined the Guard before Ch''en and they
    have long worked together, so there is none of the usual distance between superior and subordinate. Hoshiguma''s knowledge
    of Lungmen''s underworld, civic life, politics, economy, education and foreign affairs vastly exceeds Ch''en''s.'
  key_facts:
  - 陈是名义上的上司 / Ch'en is her nominal superior
  - 星熊入职早于陈 / Hoshiguma joined earlier than Ch'en
  - 对龙门更熟 / more knowledgeable about Lungmen
  traps:
  - 陈是星熊的下属 / Ch'en is Hoshiguma's subordinate (wrong — Ch'en outranks her)
  - 二人初次合作就是切尔诺伯格 / they first cooperated at Chernobog (off-canon)
  tags:
  - hoshiguma
