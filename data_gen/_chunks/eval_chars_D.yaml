- id: Q028
  category: character
  answer_type: factoid
  difficulty: medium
  question_zh: 塞雷娅的盾兼具什么功能？档案中如何评价她的战场角色？
  question_en: What dual function does Saria's shield serve, and how does the archive frame her battlefield role?
  gold_zh: 档案资料二指出：塞雷娅的盾牌同时也是她的法杖。她的战地指挥造诣很深，小队方针偏向固守，有她参与的任务中极少出现干员伤亡。一位干员的概括：「当塞雷娅女士举起盾牌时，她不是在保护身后的干员，她是在保护整支小队。」
  gold_en: 'Archive File II: her shield is also her staff. She is a strong field commander; her squad doctrine leans conservative,
    and operations with her present rarely incur operator casualties. As one operator puts it: ''When Lady Saria raises her
    shield, she is not protecting the operators behind her — she is protecting the whole squad.'''
  key_facts:
  - 盾即法杖 / shield is also her staff
  - 战地指挥造诣深 / strong field commander
  - 极少干员伤亡 / very few casualties
  traps:
  - 只能近战 / melee-only (false — she is a strategist with Arts)
  - 偏激进打法 / aggressive doctrine (the opposite — she is conservative)
  tags:
  - saria
  - defender
  - leadership
  - rhine_lab
  source: cn/operators/char_202_demkni.txt
  notes: ''
