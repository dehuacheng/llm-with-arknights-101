- id: Q027
  category: relationship
  answer_type: open_ended
  difficulty: medium
  question_zh: 档案中塞雷娅与赫默的紧张关系源自什么？
  question_en: What is the source of the tension between Saria and Silence in the archive?
  gold_zh: 档案资料三说明：与罗德岛合作的莱茵干员普遍对塞雷娅表现尊敬，但医疗干员赫默对她有明显敌意。冲突源于莱茵生命的一项实验——主导人正是赫默。该实验失败后，塞雷娅独自镇压了失控的实验品；也正因此她决定离开莱茵生命。她每次尝试与伊芙利特沟通时，赫默都会出面阻止。
  gold_en: 'Archive File III: most Rhine operators respect Saria, but Silence shows open hostility. The conflict stems from
    a Rhine Lab experiment Silence led. After it failed, Saria alone subdued the rampaging experimental subject — and the
    incident drove her departure from Rhine Lab. Whenever Saria tries to speak with Ifrit, Silence blocks her.'
  key_facts:
  - 莱茵生命失败实验 / a failed Rhine Lab experiment
  - 赫默主导 / Silence led it
  - 塞雷娅独自镇压实验品 / Saria alone subdued the subject
  - 伊芙利特相关 / involves Ifrit
  traps:
  - 二人是科研竞争对手 / they are rival researchers (incomplete — it's a specific incident)
  - 塞雷娅伤害了赫默 / Saria injured Silence (off-canon)
  tags:
