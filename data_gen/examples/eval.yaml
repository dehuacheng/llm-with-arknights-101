- id: "Q017"
  category: "faction"
  answer_type: "open_ended"
  difficulty: "medium"
  question_zh: "罗德岛与莱茵生命的关系如何随主线推进而变化？"
  question_en: "How does Rhodes Island's relationship with Rhine Lab evolve across the main story?"
  gold_zh: "起初是商业客户关系（罗德岛购买技术），切尔诺伯格事件后转为半合作的研究伙伴；莱茵生命的内部派系斗争（赛博团 vs 凯瑟琳系）后期使关系复杂化。"
  gold_en: "Begins as a vendor-client relationship (Rhodes Island purchasing tech); shifts to semi-cooperative research partnership after Chernobog; further complicated by Rhine Lab's internal faction conflict (Saber team vs Kristen's circle) in later episodes."
  key_facts:
    - "商业关系 → 研究伙伴 / vendor → research partner"
    - "切尔诺伯格事件 / Chernobog incident"
    - "莱茵生命内部派系 / Rhine Lab internal factions"
  traps:
    - "敌对关系 / adversarial (they are not enemies)"
    - "罗德岛是莱茵生命的子公司 / Rhodes Island is a subsidiary (false)"
  tags: ["rhodes_island", "rhine_lab", "relationships"]
  source: "cn/stories/main_05.txt"
  notes: "Cross-references main_07 and main_09; single-source citation is the primary."

